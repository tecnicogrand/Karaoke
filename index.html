<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke Autónomo - Búsqueda Mejorada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap');
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #050505;
            color: white;
            overflow: hidden; 
        }

        .lyric-line {
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
        }
        
        .lyric-active {
            color: #fbbf24; /* Amarillo dorado */
            font-size: 4rem;
            line-height: 1.1;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.6), 2px 2px 15px rgba(0,0,0,1);
            transform: scale(1.05);
        }

        .lyric-next {
            color: rgba(255, 255, 255, 0.4);
            font-size: 2.2rem;
            margin-top: 1.5rem;
        }

        .lyric-success {
            color: #4ade80 !important;
            text-shadow: 0 0 35px rgba(74, 222, 128, 0.9), 0 0 15px rgba(0,0,0,1) !important;
        }

        #youtube-player-container {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 120vw;
            height: 120vh;
            transform: translate(-50%, -50%);
            z-index: -2;
            pointer-events: none;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.85) 100%);
            z-index: -1;
        }

        .idle-hide {
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        .idle-show {
            opacity: 1;
            transition: opacity 0.5s ease;
        }
        
        .loader {
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: #3b82f6;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center relative">

    <section id="setup-screen" class="bg-black/60 backdrop-blur-xl p-8 md:p-10 rounded-3xl shadow-2xl w-full max-w-xl z-10 border border-white/10">
        <h1 class="text-4xl font-black mb-2 text-center bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-indigo-500 drop-shadow-md">
            <i class="fas fa-microphone-alt text-blue-400"></i> Smart Karaoke
        </h1>
        <p class="text-center text-slate-400 text-sm mb-8 font-bold tracking-wide">Base de datos LRCLIB libre y gratuita.</p>
        
        <div class="space-y-6">
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1">Enlace del Video (Obligatorio)</label>
                <input type="text" id="youtube-url" class="w-full bg-slate-900/80 border border-slate-600 rounded-xl px-5 py-4 text-white focus:outline-none focus:border-blue-500 transition-colors text-lg" placeholder="https://www.youtube.com/watch?v=...">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1">Artista y Canción (Opcional)</label>
                <input type="text" id="manual-query" class="w-full bg-slate-900/80 border border-slate-600 rounded-xl px-5 py-4 text-white focus:outline-none focus:border-indigo-500 transition-colors text-lg" placeholder="Ej: Luis Miguel La Incondicional">
                <p class="text-xs text-slate-500 mt-2 ml-1">Llena esto solo si el sistema no encuentra la letra automáticamente.</p>
            </div>
            
            <!-- Error Display -->
            <div id="error-msg" class="hidden bg-red-900/50 border border-red-500 text-red-200 text-sm p-4 rounded-xl text-center font-bold"></div>

            <button id="btn-fetch" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-black text-xl py-4 rounded-xl transition-all shadow-[0_0_20px_rgba(79,70,229,0.4)] mt-2 uppercase tracking-wide">
                Preparar Escenario
            </button>
        </div>
    </section>

    <section id="loading-screen" class="hidden flex-col items-center justify-center z-10">
        <div class="loader mb-6"></div>
        <p id="loading-text" class="text-2xl font-bold text-blue-300 text-center animate-pulse drop-shadow-lg">Conectando con la base de datos...</p>
    </section>

    <main id="karaoke-screen" class="hidden w-full h-full relative flex flex-col justify-center items-center">
        <!-- Contenedor del video de YouTube de fondo -->
        <div id="youtube-player-container"></div>
        <div class="overlay"></div>

        <!-- Start Overlay (Bypass browser autoplay policies) -->
        <div id="start-overlay" class="absolute inset-0 flex items-center justify-center bg-black/80 z-20 backdrop-blur-sm">
            <button id="btn-start-karaoke" class="bg-gradient-to-br from-green-400 to-emerald-600 hover:scale-105 text-white font-black text-4xl py-8 px-12 rounded-[3rem] shadow-[0_0_40px_rgba(16,185,129,0.5)] transition-all uppercase tracking-widest border border-green-300/30">
                <i class="fas fa-play mr-3"></i> Cantar
            </button>
        </div>

        <!-- Letras -->
        <div id="lyrics-container" class="text-center w-11/12 max-w-6xl z-10 flex flex-col items-center justify-center h-full pb-20">
            <div id="current-lyric" class="lyric-line lyric-active w-full px-4">Preparando el escenario...</div>
            <div id="next-lyric" class="lyric-line lyric-next w-full px-4 line-clamp-2">Cargando letra</div>
        </div>

        <footer id="controls-panel" class="absolute bottom-8 left-1/2 transform -translate-x-1/2 bg-black/60 backdrop-blur-xl rounded-full p-3 flex items-center gap-3 idle-show z-30 border border-white/10 shadow-2xl w-[90%] max-w-3xl justify-between">
            <div class="flex gap-2">
                <button id="btn-sync-m5" class="px-4 py-3 bg-slate-800 hover:bg-slate-700 rounded-full text-sm font-bold text-white transition">-5s</button>
                <button id="btn-sync-m" class="px-4 py-3 bg-slate-800 hover:bg-slate-700 rounded-full text-sm font-bold text-white transition">-0.5s</button>
            </div>
            
            <div class="flex flex-col items-center justify-center px-4 pointer-events-none">
                <span class="text-[10px] text-gray-400 uppercase tracking-widest font-black">Sync (Calibrar)</span>
                <span id="sync-display" class="font-mono font-bold text-blue-400 text-xl">0.0s</span>
            </div>
            
            <div class="flex gap-2">
                <button id="btn-sync-p" class="px-4 py-3 bg-slate-800 hover:bg-slate-700 rounded-full text-sm font-bold text-white transition">+0.5s</button>
                <button id="btn-sync-p5" class="px-4 py-3 bg-slate-800 hover:bg-slate-700 rounded-full text-sm font-bold text-white transition">+5s</button>
            </div>
            
            <div class="w-[2px] h-10 bg-white/10 mx-2"></div>
            
            <button id="btn-exit" class="px-6 py-3 bg-red-900/80 hover:bg-red-600 rounded-full text-sm font-black text-white shadow-lg transition uppercase tracking-wider"><i class="fas fa-sign-out-alt mr-2"></i> Salir</button>
        </footer>
    </main>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let lrcData = [];
        let currentLineIndex = -1;
        let player;
        let videoId = "";
        let syncOffset = 0; 
        let animationFrameId;
        
        const ui = {
            setup: document.getElementById('setup-screen'),
            load: document.getElementById('loading-screen'),
            karaoke: document.getElementById('karaoke-screen'),
            overlay: document.getElementById('start-overlay'),
            loadTxt: document.getElementById('loading-text'),
            curLyric: document.getElementById('current-lyric'),
            nxtLyric: document.getElementById('next-lyric'),
            syncDisp: document.getElementById('sync-display'),
            controls: document.getElementById('controls-panel'),
            errorMsg: document.getElementById('error-msg')
        };
        
        function showError(msg) {
            ui.errorMsg.textContent = msg;
            ui.errorMsg.classList.remove('hidden');
        }

        function hideError() {
            ui.errorMsg.classList.add('hidden');
        }

        function extractVideoId(url) {
            const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
            const match = url.match(regex);
            return match ? match[1] : null;
        }

        async function fetchVideoTitle(vidId) {
            try {
                const response = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${vidId}`);
                const data = await response.json();
                return data.title || "";
            } catch (e) {
                return "";
            }
        }

        async function fetchLyricsFromPublicDB(autoTitle, manualQuery) {
            let searchQuery = "";

            if (manualQuery && manualQuery.trim() !== "") {
                // Prioridad a la búsqueda manual
                searchQuery = manualQuery.trim();
            } else {
                // Limpieza agresiva del título de YouTube
                let cleanTitle = autoTitle.toLowerCase();
                // Quitar todo entre paréntesis o corchetes
                cleanTitle = cleanTitle.replace(/\([^)]*\)|\[[^\]]*\]/g, ' ');
                // Quitar palabras típicas de YouTube
                const stopWords = ['official', 'video', 'oficial', 'lyrics', 'lyric', 'letra', 'audio', 'remastered', '4k', 'hd', 'feat.', 'ft.', 'remix', 'music'];
                const regex = new RegExp(`\\b(${stopWords.join('|')})\\b`, 'gi');
                cleanTitle = cleanTitle.replace(regex, ' ');
                // Limpiar espacios múltiples y caracteres raros
                cleanTitle = cleanTitle.replace(/[-|&]/g, ' ').replace(/\s{2,}/g, ' ').trim();
                
                searchQuery = cleanTitle;
            }

            if (!searchQuery) throw new Error("No se pudo generar un texto de búsqueda válido.");

            const url = `https://lrclib.net/api/search?q=${encodeURIComponent(searchQuery)}`;
            
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("Fallo al contactar la base de datos.");
                
                const data = await response.json();
                
                // Buscar el primer track que tenga letra sincronizada
                const track = data.find(t => t.syncedLyrics);
                
                if (!track) {
                    throw new Error(`No se encontró letra para "${searchQuery}". Por favor, escribe el artista y canción en el recuadro opcional.`);
                }
                
                return track.syncedLyrics;
            } catch (err) {
                throw new Error(err.message || "Error de red al buscar la letra.");
            }
        }

        function parseLRC(lrcText) {
            const lines = lrcText.split('\n');
            const result = [];
            const regex = /\[(\d{2,}):(\d{2}(?:\.\d{1,3})?)\](.*)/;
            
            lines.forEach(line => {
                const match = line.match(regex);
                if (match) {
                    const timeInSeconds = (parseInt(match[1], 10) * 60) + parseFloat(match[2]);
                    const text = match[3].trim();
                    if (text !== "") result.push({ time: timeInSeconds, text: text });
                }
            });
            return result.sort((a, b) => a.time - b.time);
        }

        document.getElementById('btn-fetch').addEventListener('click', async () => {
            hideError();
            const url = document.getElementById('youtube-url').value.trim();
            const manualQ = document.getElementById('manual-query').value.trim();

            if (!url) return showError("Debes ingresar un enlace de YouTube.");
            
            videoId = extractVideoId(url);
            if (!videoId) return showError("El enlace de YouTube no parece ser válido.");

            ui.setup.classList.add('hidden');
            ui.load.classList.remove('hidden');
            ui.load.classList.add('flex');

            try {
                ui.loadTxt.innerText = "Obteniendo datos del video...";
                let videoTitle = "";
                if (!manualQ) {
                    videoTitle = await fetchVideoTitle(videoId);
                }
                
                ui.loadTxt.innerText = "Buscando letras sincronizadas...";
                const rawLRC = await fetchLyricsFromPublicDB(videoTitle, manualQ);
                
                lrcData = parseLRC(rawLRC);
                if (lrcData.length === 0) throw new Error("El archivo de letras obtenido estaba vacío.");

                ui.loadTxt.innerText = "Cargando reproductor y escenario...";
                setupYouTubePlayer();

            } catch (error) {
                showError(error.message);
                ui.load.classList.add('hidden');
                ui.load.classList.remove('flex');
                ui.setup.classList.remove('hidden');
            }
        });

        function setupYouTubePlayer() {
            document.getElementById('youtube-player-container').innerHTML = '<div id="yt-player"></div>';
            player = new YT.Player('yt-player', {
                height: '100%',
                width: '100%',
                videoId: videoId,
                playerVars: { 'autoplay': 0, 'controls': 0, 'disablekb': 1, 'fs': 0, 'modestbranding': 1, 'rel': 0 },
                events: { 'onReady': onPlayerReady }
            });
        }

        function onPlayerReady(event) {
            ui.load.classList.add('hidden');
            ui.load.classList.remove('flex');
            ui.karaoke.classList.remove('hidden');
            
            syncOffset = 0;
            updateSyncDisplay();
            currentLineIndex = -1;
            ui.curLyric.innerText = "¿Lista/o para cantar?";
            ui.nxtLyric.innerText = "Presiona el botón para comenzar";
        }

        document.getElementById('btn-start-karaoke').addEventListener('click', () => {
            ui.overlay.classList.add('hidden');
            player.playVideo();
            initMicForScoring(); 
            syncLoop(); 
        });

        function syncLoop() {
            if (player && player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING) {
                const currentTime = player.getCurrentTime() + syncOffset;
                
                let newIndex = -1;
                for (let i = 0; i < lrcData.length; i++) {
                    if (currentTime >= lrcData[i].time) {
                        newIndex = i;
                    } else { break; }
                }

                if (newIndex !== currentLineIndex && newIndex >= 0) {
                    currentLineIndex = newIndex;
                    ui.curLyric.innerText = lrcData[currentLineIndex].text;
                    ui.curLyric.classList.remove('lyric-success'); // Reset glow on new line
                    ui.nxtLyric.innerText = lrcData[currentLineIndex + 1] ? lrcData[currentLineIndex + 1].text : "";
                }
            }
            animationFrameId = requestAnimationFrame(syncLoop);
        }
        
        function updateSyncDisplay() {
            const sign = syncOffset > 0 ? "+" : "";
            ui.syncDisp.innerText = `${sign}${syncOffset.toFixed(1)}s`;
        }

        // Fast Sync adjust without re-rendering everything, loop will catch it automatically
        document.getElementById('btn-sync-m5').addEventListener('click', () => { syncOffset -= 5; updateSyncDisplay(); });
        document.getElementById('btn-sync-m').addEventListener('click', () => { syncOffset -= 0.5; updateSyncDisplay(); });
        document.getElementById('btn-sync-p').addEventListener('click', () => { syncOffset += 0.5; updateSyncDisplay(); });
        document.getElementById('btn-sync-p5').addEventListener('click', () => { syncOffset += 5; updateSyncDisplay(); });

        document.getElementById('btn-exit').addEventListener('click', () => {
            cancelAnimationFrame(animationFrameId);
            if(player && player.destroy) player.destroy();
            ui.karaoke.classList.add('hidden');
            ui.setup.classList.remove('hidden');
            ui.overlay.classList.remove('hidden'); // Reset start overlay
            hideError();
        });

        // Hide controls automatically
        let idleTimer;
        document.addEventListener('mousemove', () => {
            if (!ui.karaoke.classList.contains('hidden')) {
                ui.controls.classList.remove('idle-hide');
                ui.controls.classList.add('idle-show');
                clearTimeout(idleTimer);
                idleTimer = setTimeout(() => {
                    ui.controls.classList.remove('idle-show');
                    ui.controls.classList.add('idle-hide');
                }, 3500);
            }
        });

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        function initMicForScoring() {
            if (!SpeechRecognition) return; 
            try {
                recognition = new SpeechRecognition();
                recognition.lang = 'es-ES';
                recognition.continuous = true;
                recognition.interimResults = true;

                const normalize = (str) => str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^\w\s]/gi, '').toLowerCase().replace(/\s+/g, '');

                recognition.onresult = (event) => {
                    if (currentLineIndex < 0 || !lrcData[currentLineIndex]) return;
                    
                    let transcript = "";
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        transcript += event.results[i][0].transcript;
                    }
                    
                    const said = normalize(transcript);
                    const target = normalize(lrcData[currentLineIndex].text);

                    // Fuzzy match: If part of the lyric is detected, reward user
                    if (target.length > 3 && said.includes(target.substring(0, Math.floor(target.length / 2)))) {
                        ui.curLyric.classList.add('lyric-success');
                    }
                };

                recognition.onerror = (e) => console.log("Mic error:", e.error);
                recognition.onend = () => { 
                    if (!ui.karaoke.classList.contains('hidden')) {
                        try { recognition.start(); } catch(e){} 
                    }
                };
                
                recognition.start(); 
            } catch(e) {
                console.log("No se pudo iniciar el reconocimiento de voz.");
            }
        }
    </script>
</body>
</html>
