<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke Dorado - Pro DJ Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0f172a;
            color: white;
            overflow: hidden; 
        }

        .lyric-line {
            transition: all 0.3s ease;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
        }
        
        .lyric-active {
            font-size: 3.5rem;
            font-weight: 900;
            color: white;
            text-shadow: 2px 2px 10px rgba(0,0,0,1);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
        }

        .lyric-active span {
            transition: color 0.2s ease, text-shadow 0.2s ease;
        }

        .word-filled {
            color: #fbbf24 !important; /* Dorado */
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.8), 2px 2px 10px rgba(0,0,0,1) !important;
        }

        .lyric-next {
            color: rgba(255, 255, 255, 0.5);
            font-size: 2rem;
            font-weight: 700;
            margin-top: 1rem;
        }

        .lyric-prev {
            color: rgba(255, 255, 255, 0.3);
            font-size: 1.5rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .badge {
            font-size: 1rem;
            padding: 0.2rem 0.8rem;
            border-radius: 9999px;
            font-weight: 900;
            text-shadow: none;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .badge-perfect { background-color: #fbbf24; color: #713f12; box-shadow: 0 0 15px rgba(251,191,36,0.5); }
        .badge-excellent { background-color: #ec4899; color: white; box-shadow: 0 0 15px rgba(236,72,153,0.5); }
        .badge-good { background-color: #06b6d4; color: white; box-shadow: 0 0 15px rgba(6,182,212,0.5); }
        .badge-miss { background-color: #ef4444; color: white; }

        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        #youtube-player-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            pointer-events: none;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.65);
            z-index: -1;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .loader {
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: #fbbf24;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .floating-text {
            position: absolute;
            font-weight: 900;
            font-size: 2rem;
            animation: floatUp 1s ease-out forwards;
            pointer-events: none;
            z-index: 50;
        }
        @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-50px) scale(1.5); opacity: 0; } }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center">

    <!-- PANTALLA DE INICIO -->
    <div id="setup-screen" class="glass-panel p-8 rounded-2xl shadow-2xl w-full max-w-lg z-10">
        <h1 class="text-4xl font-black mb-2 text-center text-yellow-500 drop-shadow-[0_0_15px_rgba(234,179,8,0.8)]"><i class="fas fa-crown"></i> Karaoke Dorado</h1>
        <p class="text-center text-yellow-200 text-sm mb-6 font-bold tracking-widest uppercase">Canta para ganar premios</p>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm text-gray-300 mb-1 font-bold">Link de YouTube</label>
                <input type="text" id="youtube-url" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-yellow-500 shadow-inner" placeholder="Ej: https://www.youtube.com/watch?v=...">
            </div>

            <div>
                <label class="block text-sm text-gray-300 mb-1 font-bold">Nombre Canción (Opcional - Ayuda al buscador)</label>
                <input type="text" id="manual-query" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-yellow-500 shadow-inner" placeholder="Ej: Luis Miguel La Incondicional">
            </div>
            
            <!-- MODO VDJ -->
            <div class="flex items-center mt-4 bg-slate-900/50 p-4 rounded-lg border border-purple-500/30">
                <input type="checkbox" id="vdj-mode-toggle" class="w-5 h-5 text-purple-600 bg-gray-100 border-gray-300 rounded focus:ring-purple-500">
                <label for="vdj-mode-toggle" class="ml-3 text-sm font-medium text-gray-300 flex-1 cursor-pointer">
                    <span class="text-purple-400 font-bold text-base"><i class="fas fa-compact-disc"></i> Modo VDJ / Pioneer DJ</span><br>
                    <span class="text-xs text-gray-400">Desactiva el micrófono web y silencia el video. Previene que VirtualDJ (ASIO) congele la PC.</span>
                </label>
            </div>
            
            <button id="btn-fetch" class="w-full bg-gradient-to-r from-yellow-600 to-yellow-500 hover:from-yellow-500 hover:to-yellow-400 text-white font-black py-4 px-4 rounded-lg transition-colors mt-4 shadow-[0_0_20px_rgba(202,138,4,0.6)] text-lg">
                Generar Karaoke
            </button>
        </div>
    </div>

    <!-- PANTALLA DE CARGA -->
    <div id="loading-screen" class="hidden flex-col items-center justify-center z-10">
        <div class="loader mb-4"></div>
        <p id="loading-text" class="text-xl font-bold text-yellow-400 text-center px-4">Conectando...</p>
    </div>

    <!-- PANTALLA DE RESULTADOS -->
    <div id="results-screen" class="hidden glass-panel p-10 rounded-3xl shadow-[0_0_50px_rgba(234,179,8,0.3)] z-50 flex flex-col items-center max-w-md w-full">
        <h2 class="text-4xl font-black text-yellow-500 mb-2"><i class="fas fa-trophy"></i> ¡Terminado!</h2>
        <p class="text-gray-300 mb-8 font-bold tracking-widest uppercase">Resultados Finales</p>
        
        <div class="w-full space-y-4 mb-8">
            <div class="flex justify-between items-center bg-slate-900/80 p-4 rounded-xl">
                <span class="text-gray-400 font-bold">Puntaje Total</span>
                <span id="res-score" class="text-3xl font-black text-white drop-shadow-[0_0_10px_rgba(255,255,255,0.5)]">0</span>
            </div>
            <div class="flex justify-between items-center bg-slate-900/80 p-4 rounded-xl">
                <span class="text-gray-400 font-bold">Precisión</span>
                <span id="res-accuracy" class="text-2xl font-black text-cyan-400">0%</span>
            </div>
            <div class="flex justify-between items-center bg-slate-900/80 p-4 rounded-xl">
                <span class="text-gray-400 font-bold">Líneas Correctas</span>
                <span id="res-hits" class="text-xl font-bold text-green-400">0</span>
            </div>
        </div>
        
        <button id="btn-restart" class="w-full bg-yellow-600 hover:bg-yellow-500 text-white font-black py-4 px-4 rounded-xl transition-all shadow-[0_0_20px_rgba(202,138,4,0.5)]">
            Cantar Otra Canción
        </button>
    </div>

    <!-- PANTALLA DE KARAOKE PRINCIPAL -->
    <div id="karaoke-screen" class="hidden w-full h-full relative flex flex-col justify-center items-center">
        <div id="youtube-player-container"></div>
        <div class="overlay"></div>

        <!-- HUD (Score y Combo) -->
        <div class="absolute top-6 right-8 text-right z-20">
            <div class="text-5xl font-black text-white drop-shadow-[0_0_15px_rgba(251,191,36,0.8)] tracking-tighter" id="score-display">0</div>
            <div class="text-xl font-bold text-yellow-400 mt-1 uppercase tracking-widest" id="combo-display">Combo x1</div>
        </div>

        <!-- Debug Mic (Qué escucha) -->
        <div id="mic-debug-panel" class="absolute top-6 left-8 max-w-sm glass-panel p-3 rounded-lg z-20 hidden">
            <div class="text-xs text-gray-400 font-bold uppercase mb-1"><i class="fas fa-ear-listen"></i> Micro Escucha:</div>
            <div id="mic-debug-text" class="text-sm text-cyan-300 font-mono">Esperando voz...</div>
        </div>

        <!-- VDJ Indicator -->
        <div id="vdj-indicator" class="absolute top-6 left-8 glass-panel p-3 rounded-lg z-20 hidden border-purple-500">
            <div class="text-sm text-purple-400 font-bold uppercase"><i class="fas fa-compact-disc"></i> Modo VDJ Activo</div>
            <div class="text-xs text-gray-400">Micrófono Web Desactivado</div>
        </div>

        <!-- Overlay Start -->
        <div id="start-overlay" class="absolute inset-0 flex items-center justify-center bg-black/80 z-30">
            <button id="btn-start-karaoke" class="bg-gradient-to-r from-green-500 to-emerald-400 hover:from-green-400 hover:to-emerald-300 text-white font-black text-3xl py-6 px-12 rounded-full shadow-[0_0_40px_rgba(52,211,153,0.6)] transform hover:scale-105 transition-all border-4 border-white/20">
                <i class="fas fa-play mr-2"></i> ¡Comenzar!
            </button>
        </div>

        <!-- Temporizador 3-2-1 -->
        <div id="countdown-screen" class="absolute inset-0 flex items-center justify-center bg-black/80 z-40 hidden">
            <div id="countdown-number" class="text-[15rem] font-black text-white drop-shadow-[0_0_50px_rgba(251,191,36,1)]">3</div>
        </div>

        <!-- Contenedor Central Letras -->
        <div id="lyrics-container" class="text-center w-4/5 z-10 mt-10">
            <div id="prev-lyric-container" class="lyric-prev">
                <span id="prev-lyric-text">...</span>
                <span id="prev-lyric-badge"></span>
            </div>
            <div id="current-lyric" class="lyric-line lyric-active">...</div>
            <div id="next-lyric" class="lyric-line lyric-next">...</div>
        </div>

        <!-- Panel de Controles -->
        <div id="controls-panel" class="absolute bottom-8 left-1/2 transform -translate-x-1/2 glass-panel rounded-2xl p-4 flex items-center gap-3 z-20 transition-opacity duration-500 opacity-100">
            
            <button id="btn-toggle-mic" class="px-4 py-3 bg-slate-800 hover:bg-slate-700 rounded-xl text-sm font-bold text-cyan-400 transition" title="Mostrar/Ocultar Mic">
                <i class="fas fa-microphone"></i>
            </button>

            <button id="btn-pause" class="px-5 py-3 bg-yellow-600 hover:bg-yellow-500 rounded-xl text-white font-black transition shadow-[0_0_15px_rgba(202,138,4,0.4)]">
                <i class="fas fa-pause"></i>
            </button>

            <div class="h-8 w-px bg-white/20 mx-2"></div>

            <button id="btn-sync-m5" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm font-bold transition text-gray-300">-5s</button>
            <button id="btn-sync-m" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm font-bold transition text-gray-300">-0.5s</button>
            <div class="flex flex-col items-center justify-center px-2 min-w-[80px]">
                <span class="text-[10px] text-gray-500 uppercase tracking-widest">Sinc.</span>
                <span id="sync-display" class="font-mono font-bold text-yellow-400 text-base">0.0s</span>
            </div>
            <button id="btn-sync-p" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm font-bold transition text-gray-300">+0.5s</button>
            <button id="btn-sync-p5" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm font-bold transition text-gray-300">+5s</button>
            
            <div class="h-8 w-px bg-white/20 mx-2"></div>

            <button id="btn-exit" class="px-4 py-3 bg-red-600/80 hover:bg-red-500 rounded-xl text-sm font-bold shadow-lg transition text-white">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // Variables Globales
        let lrcData = [];
        let currentLineIndex = -1;
        let player;
        let videoId = "";
        let syncOffset = 0; 
        let animationFrameId;
        let isPaused = false;
        
        // Puntuación
        let score = 0;
        let combo = 1;
        let currentLineMaxScore = 0;
        let currentLineScore = 0;
        let wordsSaidInLine = new Set();
        let totalLines = 0;
        let linesHit = 0;
        let isVdjModeActive = false;

        // DOM Elements
        const setupScreen = document.getElementById('setup-screen');
        const loadingScreen = document.getElementById('loading-screen');
        const karaokeScreen = document.getElementById('karaoke-screen');
        const startOverlay = document.getElementById('start-overlay');
        const countdownScreen = document.getElementById('countdown-screen');
        const countdownNumber = document.getElementById('countdown-number');
        const resultsScreen = document.getElementById('results-screen');
        
        const currentLyricEl = document.getElementById('current-lyric');
        const nextLyricEl = document.getElementById('next-lyric');
        const prevLyricText = document.getElementById('prev-lyric-text');
        const prevLyricBadge = document.getElementById('prev-lyric-badge');
        
        const scoreDisplay = document.getElementById('score-display');
        const comboDisplay = document.getElementById('combo-display');
        const micDebugPanel = document.getElementById('mic-debug-panel');
        const micDebugText = document.getElementById('mic-debug-text');
        const vdjIndicator = document.getElementById('vdj-indicator');
        const syncDisplay = document.getElementById('sync-display');

        function extractVideoId(url) {
            const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
            const match = url.match(regex);
            return match ? match[1] : null;
        }

        async function fetchVideoTitle(vidId) {
            try {
                const response = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${vidId}`);
                const data = await response.json();
                return data.title || "";
            } catch (e) {
                return "";
            }
        }

        async function fetchLyricsFromPublicDB(title) {
            // Limpia "Video oficial", etc.
            const cleanTitle = title.replace(/\([^)]*\)|\[[^\]]*\]|video|oficial|official|lyric|lyrics|audio|remastered/gi, '').trim();
            const response = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(cleanTitle)}`);
            if (!response.ok) throw new Error("Error de conexión con LRCLIB");
            
            const data = await response.json();
            const track = data.find(t => t.syncedLyrics);
            if (!track) throw new Error("No se encontraron letras sincronizadas.");
            
            return track.syncedLyrics;
        }

        function parseLRC(lrcText) {
            const lines = lrcText.split('\n');
            const result = [];
            const regex = /\[(\d{2}):(\d{2}(?:\.\d{1,3})?)\](.*)/;
            
            lines.forEach(line => {
                const match = line.match(regex);
                if (match) {
                    const timeInSeconds = (parseInt(match[1]) * 60) + parseFloat(match[2]);
                    const text = match[3].trim();
                    if (text !== "") {
                        result.push({ 
                            time: timeInSeconds, 
                            text: text,
                            words: text.split(/\s+/).filter(w => w.length > 0)
                        });
                    }
                }
            });
            return result.sort((a, b) => a.time - b.time);
        }

        document.getElementById('btn-fetch').addEventListener('click', async () => {
            const url = document.getElementById('youtube-url').value.trim();
            const manualQuery = document.getElementById('manual-query').value.trim();
            isVdjModeActive = document.getElementById('vdj-mode-toggle').checked;

            if (!url) return alert("Ingresa el link de YouTube.");
            
            videoId = extractVideoId(url);
            if (!videoId) return alert("Enlace no válido.");

            setupScreen.classList.add('hidden');
            loadingScreen.classList.remove('hidden');
            loadingScreen.classList.add('flex');

            try {
                let searchQuery = manualQuery;
                if (!searchQuery) {
                    document.getElementById('loading-text').innerText = "Analizando video...";
                    searchQuery = await fetchVideoTitle(videoId);
                }

                document.getElementById('loading-text').innerText = `Buscando letras: ${searchQuery}...`;
                const rawLRC = await fetchLyricsFromPublicDB(searchQuery);
                
                lrcData = parseLRC(rawLRC);
                if (lrcData.length === 0) throw new Error("Archivo LRC vacío.");

                totalLines = lrcData.length;
                document.getElementById('loading-text').innerText = "Montando escenario...";
                setupYouTubePlayer();

            } catch (error) {
                alert(`Aviso: ${error.message}\nIntenta poner el Artista y Canción en la caja de búsqueda manual.`);
                loadingScreen.classList.add('hidden');
                loadingScreen.classList.remove('flex');
                setupScreen.classList.remove('hidden');
            }
        });

        function setupYouTubePlayer() {
            document.getElementById('youtube-player-container').innerHTML = '<div id="yt-player"></div>';
            player = new YT.Player('yt-player', {
                height: '100%',
                width: '100%',
                videoId: videoId,
                playerVars: { 'autoplay': 0, 'controls': 0, 'disablekb': 1, 'fs': 0, 'modestbranding': 1, 'rel': 0 },
                events: { 
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            loadingScreen.classList.add('hidden');
            loadingScreen.classList.remove('flex');
            karaokeScreen.classList.remove('hidden');
            
            // Si es modo VDJ, silenciamos el video. Si no, al 100%.
            if (isVdjModeActive) {
                player.mute();
                vdjIndicator.classList.remove('hidden');
            } else {
                player.unMute();
                player.setVolume(100);
            }

            resetGame();
            currentLyricEl.innerHTML = "<span>Prepara tu voz...</span>";
            nextLyricEl.innerText = "Presiona Comenzar";
        }

        function onPlayerStateChange(event) {
            // Detectar final del video
            if (event.data === YT.PlayerState.ENDED) {
                showResults();
            }
        }

        document.getElementById('btn-start-karaoke').addEventListener('click', () => {
            startOverlay.classList.add('hidden');
            player.playVideo();
            
            if (!isVdjModeActive) {
                initMicForScoring();
            }
            
            syncLoop(); 
        });

        function syncLoop() {
            if (isPaused) return;

            if (player && player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING) {
                const currentTime = player.getCurrentTime() + syncOffset;
                
                let newIndex = -1;
                for (let i = 0; i < lrcData.length; i++) {
                    if (currentTime >= lrcData[i].time) {
                        newIndex = i;
                    } else { break; }
                }

                if (newIndex !== currentLineIndex && newIndex >= 0) {
                    // Evaluar línea anterior antes de cambiar
                    if (currentLineIndex >= 0 && !isVdjModeActive) evaluateLineScore();

                    currentLineIndex = newIndex;
                    renderCurrentLine(newIndex);
                    
                    nextLyricEl.innerText = lrcData[currentLineIndex + 1] ? lrcData[currentLineIndex + 1].text : "";
                    
                    // Resetear datos para la nueva línea
                    wordsSaidInLine.clear();
                    currentLineScore = 0;
                }

                // Efecto Karaoke Fill: iluminar palabras basándose en el progreso del tiempo
                if (currentLineIndex >= 0 && lrcData[currentLineIndex + 1]) {
                    const startTime = lrcData[currentLineIndex].time;
                    const endTime = lrcData[currentLineIndex + 1].time;
                    const duration = endTime - startTime;
                    const elapsed = currentTime - startTime;
                    const progress = Math.min(Math.max(elapsed / duration, 0), 1);
                    
                    const spans = currentLyricEl.querySelectorAll('span');
                    const totalWords = spans.length;
                    const wordsToFill = Math.floor(progress * totalWords);
                    
                    spans.forEach((span, idx) => {
                        if (idx < wordsToFill) {
                            span.classList.add('word-filled');
                        } else {
                            span.classList.remove('word-filled');
                        }
                    });
                }
            }
            animationFrameId = requestAnimationFrame(syncLoop);
        }

        function renderCurrentLine(index) {
            const line = lrcData[index];
            currentLyricEl.innerHTML = '';
            line.words.forEach(word => {
                const span = document.createElement('span');
                span.innerText = word + ' ';
                currentLyricEl.appendChild(span);
            });
        }

        function evaluateLineScore() {
            const line = lrcData[currentLineIndex];
            const targetWords = line.words.length;
            if (targetWords === 0) return;

            // Frases cortas (3 palabras o menos) son más tolerantes
            const hitCount = wordsSaidInLine.size;
            let percentage = hitCount / targetWords;
            
            if (targetWords <= 3 && hitCount >= 1) {
                percentage = 1.0; // Con atinar a una en frase corta, te da el 100%
            }

            let badgeHtml = "";
            let earnedPoints = 0;

            if (percentage >= 0.8) {
                earnedPoints = 300 * combo;
                badgeHtml = `<span class="badge badge-perfect">PERFECTO 🌟 +${earnedPoints}</span>`;
                combo++;
                linesHit++;
            } else if (percentage >= 0.5) {
                earnedPoints = 200 * combo;
                badgeHtml = `<span class="badge badge-excellent">EXCELENTE 🔥 +${earnedPoints}</span>`;
                combo++;
                linesHit++;
            } else if (percentage >= 0.3) {
                earnedPoints = 100 * combo;
                badgeHtml = `<span class="badge badge-good">BIEN 👍 +${earnedPoints}</span>`;
                combo = Math.min(combo + 1, 5); // Límite combo
                linesHit++;
            } else {
                badgeHtml = `<span class="badge badge-miss">FALLO ❌</span>`;
                combo = 1;
            }

            score += earnedPoints;
            scoreDisplay.innerText = score;
            comboDisplay.innerText = `Combo x${combo}`;

            // Actualizar Historial
            prevLyricText.innerText = line.text;
            prevLyricBadge.innerHTML = badgeHtml;
            
            // Pop float text en el HUD
            if (earnedPoints > 0) {
                showFloatingText(`+${earnedPoints}`);
            }
        }

        function showFloatingText(text) {
            const floatEl = document.createElement('div');
            floatEl.className = 'floating-text text-yellow-400';
            floatEl.innerText = text;
            floatEl.style.right = '40px';
            floatEl.style.top = '100px';
            document.body.appendChild(floatEl);
            setTimeout(() => floatEl.remove(), 1000);
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        function initMicForScoring() {
            if (!SpeechRecognition) return; 
            recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.continuous = true;
            recognition.interimResults = true;

            const normalize = (str) => str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^\w\s]/gi, '').toLowerCase().replace(/\s+/g, '');

            recognition.onresult = (event) => {
                if (currentLineIndex < 0 || isPaused) return;
                
                let transcript = "";
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    transcript += event.results[i][0].transcript;
                }
                
                micDebugText.innerText = transcript || "...";
                
                const spokenWords = normalize(transcript).split(/\s+/);
                const targetWordsRaw = lrcData[currentLineIndex].words;

                // Matcher
                targetWordsRaw.forEach((tWord, idx) => {
                    const cleanTarget = normalize(tWord);
                    if (cleanTarget.length < 2) return; // Ignorar a, y, o
                    
                    spokenWords.forEach(sWord => {
                        // Tolerancia: Si la palabra dicha contiene a la objetivo, o viceversa
                        if (sWord.includes(cleanTarget) || cleanTarget.includes(sWord)) {
                            if (sWord.length >= cleanTarget.length / 2) {
                                wordsSaidInLine.add(idx);
                            }
                        }
                    });
                });
            };

            recognition.onerror = () => {};
            recognition.onend = () => { 
                if (!isPaused && !karaokeScreen.classList.contains('hidden') && !isVdjModeActive) {
                    try { recognition.start(); } catch(e){} 
                }
            };
            try { recognition.start(); } catch(e){}
        }

        function updateSyncDisplay() {
            const sign = syncOffset >= 0 ? "+" : "";
            syncDisplay.innerText = `${sign}${syncOffset.toFixed(1)}s`;
        }

        document.getElementById('btn-sync-m5').addEventListener('click', () => { syncOffset -= 5; updateSyncDisplay(); });
        document.getElementById('btn-sync-m').addEventListener('click', () => { syncOffset -= 0.5; updateSyncDisplay(); });
        document.getElementById('btn-sync-p').addEventListener('click', () => { syncOffset += 0.5; updateSyncDisplay(); });
        document.getElementById('btn-sync-p5').addEventListener('click', () => { syncOffset += 5; updateSyncDisplay(); });

        document.getElementById('btn-toggle-mic').addEventListener('click', () => {
            micDebugPanel.classList.toggle('hidden');
        });

        // Pausa y Resume con Temporizador
        document.getElementById('btn-pause').addEventListener('click', () => {
            if (isPaused) return; // Si ya está en pausa, no hacer nada
            
            isPaused = true;
            player.pauseVideo();
            cancelAnimationFrame(animationFrameId);
            if(recognition) recognition.stop();
            
            document.getElementById('btn-pause').innerHTML = '<i class="fas fa-play"></i>';
            document.getElementById('btn-pause').classList.replace('bg-yellow-600', 'bg-green-600');
            
            // Para reanudar usamos el temporizador
            document.getElementById('btn-pause').onclick = startResumeCountdown;
        });

        function startResumeCountdown() {
            document.getElementById('btn-pause').onclick = null; // desvincular temporalmente
            countdownScreen.classList.remove('hidden');
            let count = 3;
            countdownNumber.innerText = count;
            
            const countInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownNumber.innerText = count;
                } else {
                    clearInterval(countInterval);
                    countdownScreen.classList.add('hidden');
                    resumeGame();
                }
            }, 1000);
        }

        function resumeGame() {
            isPaused = false;
            player.playVideo();
            document.getElementById('btn-pause').innerHTML = '<i class="fas fa-pause"></i>';
            document.getElementById('btn-pause').classList.replace('bg-green-600', 'bg-yellow-600');
            
            // Volver a vincular pausa original
            document.getElementById('btn-pause').onclick = () => document.getElementById('btn-pause').click();

            if (!isVdjModeActive) {
                try { recognition.start(); } catch(e){}
            }
            syncLoop();
        }

        // Pantalla de Resultados
        function showResults() {
            cancelAnimationFrame(animationFrameId);
            if(recognition) recognition.stop();
            
            let accuracy = 0;
            if (totalLines > 0) accuracy = Math.round((linesHit / totalLines) * 100);

            document.getElementById('res-score').innerText = score;
            document.getElementById('res-accuracy').innerText = `${accuracy}%`;
            document.getElementById('res-hits').innerText = `${linesHit} / ${totalLines}`;
            
            karaokeScreen.classList.add('hidden');
            resultsScreen.classList.remove('hidden');
        }

        function resetGame() {
            score = 0;
            combo = 1;
            totalLines = 0;
            linesHit = 0;
            scoreDisplay.innerText = "0";
            comboDisplay.innerText = "Combo x1";
            prevLyricText.innerText = "...";
            prevLyricBadge.innerHTML = "";
            micDebugText.innerText = "Esperando voz...";
        }

        document.getElementById('btn-restart').addEventListener('click', () => {
            resultsScreen.classList.add('hidden');
            setupScreen.classList.remove('hidden');
            if(player && player.destroy) player.destroy();
        });

        document.getElementById('btn-exit').addEventListener('click', () => {
            cancelAnimationFrame(animationFrameId);
            if(recognition) recognition.stop();
            if(player && player.destroy) player.destroy();
            karaokeScreen.classList.add('hidden');
            setupScreen.classList.remove('hidden');
        });
    </script>
</body>
</html>
