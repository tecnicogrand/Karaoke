<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke Dorado - Pro Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #020617; /* Slate 950 */
            color: white;
            overflow: hidden; 
            margin: 0;
            padding: 0;
        }

        /* Utilidades de Cristal (Glassmorphism) */
        .glass-panel {
            background: rgba(15, 23, 42, 0.6); /* Slate 900 con transparencia */
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(251, 191, 36, 0.2); /* Borde dorado sutil */
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .lyric-line {
            transition: all 0.2s ease-out;
            text-shadow: 3px 3px 10px rgba(0,0,0,0.9);
            min-height: 4rem; /* Prevenir saltos de diseño */
        }
        
        .lyric-active {
            font-size: 3.8rem;
            font-weight: 900;
            color: white;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            line-height: 1.2;
        }

        .lyric-active span {
            transition: color 0.1s ease, text-shadow 0.1s ease;
        }

        /* Efecto Karaoke Fill Palabra por Palabra */
        .word-filled {
            color: #fbbf24 !important; /* Dorado */
            text-shadow: 0 0 25px rgba(251, 191, 36, 0.8), 2px 2px 5px rgba(0,0,0,1) !important;
        }

        .lyric-next {
            color: rgba(255, 255, 255, 0.4);
            font-size: 2.2rem;
            font-weight: 700;
            margin-top: 1.5rem;
        }

        .lyric-prev {
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            opacity: 0.8;
        }

        .badge {
            font-size: 1.2rem;
            padding: 0.3rem 1rem;
            border-radius: 9999px;
            font-weight: 900;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            letter-spacing: 1px;
        }
        .badge-perfect { background: linear-gradient(135deg, #f59e0b, #fbbf24); color: #451a03; box-shadow: 0 0 20px rgba(251,191,36,0.6); }
        .badge-excellent { background: linear-gradient(135deg, #d946ef, #ec4899); color: white; box-shadow: 0 0 20px rgba(236,72,153,0.6); }
        .badge-good { background: linear-gradient(135deg, #0ea5e9, #06b6d4); color: white; box-shadow: 0 0 20px rgba(6,182,212,0.6); }
        .badge-miss { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }

        @keyframes popIn { 
            0% { transform: scale(0.3) translateY(20px); opacity: 0; } 
            70% { transform: scale(1.1); }
            100% { transform: scale(1) translateY(0); opacity: 1; } 
        }

        .floating-text {
            position: absolute;
            font-weight: 900;
            font-size: 2.5rem;
            color: #fbbf24;
            text-shadow: 0 0 15px rgba(251, 191, 36, 0.8), 2px 2px 5px rgba(0,0,0,1);
            animation: floatUp 1.2s ease-out forwards;
            pointer-events: none;
            z-index: 50;
        }
        @keyframes floatUp { 
            0% { transform: translateY(0) scale(1); opacity: 1; } 
            100% { transform: translateY(-80px) scale(1.5); opacity: 0; } 
        }

        #youtube-player-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            pointer-events: none;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            /* Gradiente sutil para darle profundidad al video */
            background: radial-gradient(circle at center, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.8) 100%);
            z-index: -1;
        }

        .loader-gold {
            border: 4px solid rgba(251, 191, 36, 0.1);
            border-left-color: #fbbf24;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .pulse-gold {
            animation: pulse-border 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-border {
            0%, 100% { border-color: rgba(251, 191, 36, 0.2); box-shadow: 0 0 0 rgba(251, 191, 36, 0); }
            50% { border-color: rgba(251, 191, 36, 0.8); box-shadow: 0 0 20px rgba(251, 191, 36, 0.4); }
        }
    </style>
</head>
<body class="flex items-center justify-center">

    <div id="setup-screen" class="glass-panel p-10 rounded-3xl w-full max-w-xl z-10 mx-4">
        <div class="text-center mb-8">
            <h1 class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-yellow-500 to-yellow-600 drop-shadow-lg mb-2">
                <i class="fas fa-crown text-yellow-500"></i> Karaoke Dorado
            </h1>
            <p class="text-yellow-200/70 text-sm font-bold tracking-[0.2em] uppercase">Canta para ganar premios</p>
        </div>
        
        <div class="space-y-5">
            <div>
                <label class="block text-sm text-gray-300 mb-2 font-bold ml-1">Link de YouTube (Video de Fondo)</label>
                <input type="text" id="youtube-url" class="w-full bg-slate-900/80 border border-slate-600 rounded-xl px-5 py-4 text-white focus:outline-none focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500 transition-all placeholder-slate-500" placeholder="Ej: https://www.youtube.com/watch?v=...">
            </div>

            <div>
                <label class="block text-sm text-gray-300 mb-2 font-bold ml-1">Nombre Canción <span class="text-xs text-gray-500 font-normal">(Si el link falla)</span></label>
                <input type="text" id="manual-query" class="w-full bg-slate-900/80 border border-slate-600 rounded-xl px-5 py-4 text-white focus:outline-none focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500 transition-all placeholder-slate-500" placeholder="Ej: Luis Miguel La Incondicional">
            </div>
            
            <div class="flex items-center mt-6 bg-slate-900/50 p-4 rounded-xl border border-slate-700">
                <input type="checkbox" id="vdj-mode-toggle" class="w-5 h-5 text-yellow-500 bg-slate-800 border-slate-600 rounded focus:ring-yellow-500 focus:ring-offset-slate-900">
                <label for="vdj-mode-toggle" class="ml-4 text-sm font-medium text-gray-300 cursor-pointer select-none">
                    <span class="text-white font-bold"><i class="fas fa-compact-disc text-purple-400"></i> Modo VDJ / Evento Pro</span><br>
                    <span class="text-xs text-slate-400">Apaga el micrófono y la puntuación. Solo muestra la letra.</span>
                </label>
            </div>
            
            <button id="btn-fetch" class="w-full bg-gradient-to-r from-yellow-600 to-yellow-500 hover:from-yellow-500 hover:to-yellow-400 text-white font-black text-xl py-5 rounded-xl transition-all mt-6 shadow-[0_0_30px_rgba(202,138,4,0.4)] hover:shadow-[0_0_40px_rgba(251,191,36,0.6)] transform hover:-translate-y-1">
                Generar Escenario
            </button>
            <div id="setup-error" class="text-red-400 text-sm font-bold text-center hidden mt-4 bg-red-900/30 p-3 rounded-lg border border-red-500/30"></div>
        </div>
    </div>

    <div id="loading-screen" class="hidden flex-col items-center justify-center z-10 glass-panel p-12 rounded-3xl">
        <div class="loader-gold mb-6"></div>
        <p id="loading-text" class="text-2xl font-bold text-yellow-400 text-center">Afinando instrumentos...</p>
    </div>

    <div id="results-screen" class="hidden glass-panel p-10 rounded-3xl shadow-[0_0_50px_rgba(251,191,36,0.2)] z-50 flex-col items-center max-w-md w-full mx-4">
        <h2 class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-600 mb-2"><i class="fas fa-trophy text-yellow-500"></i> ¡Show Terminado!</h2>
        <p class="text-slate-400 mb-8 font-bold tracking-widest uppercase text-sm">Resumen de Puntuación</p>
        
        <div class="w-full space-y-4 mb-10">
            <div class="flex justify-between items-center bg-slate-900/80 p-5 rounded-2xl border border-slate-700">
                <span class="text-slate-400 font-bold uppercase text-sm">Puntaje Total</span>
                <span id="res-score" class="text-4xl font-black text-yellow-400 drop-shadow-[0_0_10px_rgba(251,191,36,0.5)]">0</span>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-slate-900/80 p-4 rounded-2xl text-center border border-slate-700">
                    <span class="block text-slate-500 font-bold uppercase text-xs mb-1">Precisión</span>
                    <span id="res-accuracy" class="text-2xl font-black text-cyan-400">0%</span>
                </div>
                <div class="bg-slate-900/80 p-4 rounded-2xl text-center border border-slate-700">
                    <span class="block text-slate-500 font-bold uppercase text-xs mb-1">Aciertos</span>
                    <span id="res-hits" class="text-2xl font-black text-green-400">0</span>
                </div>
            </div>
        </div>
        
        <button id="btn-restart" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white font-bold py-4 rounded-xl transition-all hover:border-yellow-500 flex items-center justify-center gap-2">
            <i class="fas fa-redo"></i> Cantar Otra Canción
        </button>
    </div>

    <div id="karaoke-screen" class="hidden w-full h-full relative flex flex-col justify-center items-center">
        <div id="youtube-player-container"></div>
        <div class="overlay"></div>

        <!-- Panel de Puntuación Superior -->
        <div id="hud-panel" class="absolute top-8 right-10 text-right z-20">
            <div class="text-6xl font-black text-white drop-shadow-[0_0_20px_rgba(251,191,36,0.8)] tracking-tighter" id="score-display">0</div>
            <div class="text-xl font-bold text-yellow-400 mt-2 uppercase tracking-[0.2em] bg-black/40 inline-block px-4 py-1 rounded-full border border-yellow-500/30" id="combo-display">Combo x1</div>
        </div>

        <!-- Monitor del Micrófono (Opción 1) -->
        <div id="mic-debug-panel" class="absolute top-8 left-10 max-w-sm glass-panel p-4 rounded-2xl z-20">
            <div class="flex items-center gap-2 mb-2">
                <div id="mic-status-dot" class="w-3 h-3 rounded-full bg-yellow-500 animate-pulse"></div>
                <div class="text-xs text-slate-300 font-bold uppercase tracking-wider">Monitor de Voz</div>
            </div>
            <div id="mic-debug-text" class="text-sm text-cyan-300 font-medium italic min-h-[1.25rem]">Escuchando ambiente...</div>
            <div class="text-[10px] text-slate-500 mt-2 border-t border-slate-700/50 pt-2">Sube el volumen de la bocina para que la PC escuche.</div>
        </div>

        <!-- Botón de Inicio Gigante -->
        <div id="start-overlay" class="absolute inset-0 flex items-center justify-center bg-black/80 z-30 backdrop-blur-sm">
            <button id="btn-start-karaoke" class="pulse-gold bg-gradient-to-b from-yellow-500 to-yellow-700 hover:from-yellow-400 hover:to-yellow-600 text-white font-black text-4xl py-8 px-16 rounded-full transform hover:scale-105 transition-all border-4 border-yellow-300/50 flex items-center gap-4 shadow-[0_0_60px_rgba(251,191,36,0.4)]">
                <i class="fas fa-play"></i> ¡Comenzar!
            </button>
        </div>

        <!-- Temporizador de Pausa -->
        <div id="countdown-screen" class="absolute inset-0 flex items-center justify-center bg-black/80 z-40 hidden backdrop-blur-md">
            <div id="countdown-number" class="text-[20rem] font-black text-yellow-400 drop-shadow-[0_0_80px_rgba(251,191,36,1)]">3</div>
        </div>

        <div id="lyrics-container" class="text-center w-5/6 z-10 mt-16">
            <div id="prev-lyric-container" class="lyric-prev">
                <span id="prev-lyric-text">...</span>
                <span id="prev-lyric-badge"></span>
            </div>
            <div id="current-lyric" class="lyric-line lyric-active">...</div>
            <div id="next-lyric" class="lyric-line lyric-next">...</div>
        </div>

        <!-- Panel de Controles Inferior -->
        <div id="controls-panel" class="absolute bottom-10 left-1/2 transform -translate-x-1/2 glass-panel rounded-full p-3 flex items-center gap-2 z-20 transition-opacity duration-500">
            
            <button id="btn-toggle-mic" class="w-12 h-12 bg-slate-800 hover:bg-slate-700 rounded-full text-lg font-bold text-cyan-400 transition border border-slate-600 flex items-center justify-center" title="Mostrar/Ocultar Mic">
                <i class="fas fa-microphone"></i>
            </button>

            <button id="btn-pause" class="w-14 h-14 bg-gradient-to-r from-yellow-600 to-yellow-500 hover:from-yellow-500 hover:to-yellow-400 rounded-full text-white text-xl font-black transition shadow-[0_0_15px_rgba(202,138,4,0.4)] flex items-center justify-center border-2 border-yellow-300/30 ml-2">
                <i class="fas fa-pause"></i>
            </button>

            <div class="h-10 w-px bg-white/20 mx-3"></div>

            <button id="btn-sync-m" class="px-4 py-3 bg-slate-800/80 hover:bg-slate-700 rounded-full text-sm font-bold transition text-slate-300 border border-slate-600/50">-0.5s</button>
            <div class="flex flex-col items-center justify-center px-2 min-w-[80px]">
                <span class="text-[9px] text-slate-400 uppercase tracking-widest mb-1">Sincronía</span>
                <span id="sync-display" class="font-mono font-bold text-yellow-400 text-base">0.0s</span>
            </div>
            <button id="btn-sync-p" class="px-4 py-3 bg-slate-800/80 hover:bg-slate-700 rounded-full text-sm font-bold transition text-slate-300 border border-slate-600/50">+0.5s</button>
            
            <div class="h-10 w-px bg-white/20 mx-3"></div>

            <button id="btn-exit" class="w-12 h-12 bg-red-600/80 hover:bg-red-500 rounded-full text-lg font-bold shadow-lg transition text-white flex items-center justify-center border border-red-400/50">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // Variables de Estado
        let lrcData = [];
        let currentLineIndex = -1;
        let player;
        let videoId = "";
        let syncOffset = 0; 
        let animationFrameId;
        let isPaused = false;
        let isVdjModeActive = false;
        
        // Puntuación
        let score = 0;
        let combo = 1;
        let wordsSaidInLine = new Set();
        let totalLines = 0;
        let linesHit = 0;

        // Elementos DOM
        const setupScreen = document.getElementById('setup-screen');
        const setupError = document.getElementById('setup-error');
        const loadingScreen = document.getElementById('loading-screen');
        const karaokeScreen = document.getElementById('karaoke-screen');
        const startOverlay = document.getElementById('start-overlay');
        const countdownScreen = document.getElementById('countdown-screen');
        const resultsScreen = document.getElementById('results-screen');
        
        const currentLyricEl = document.getElementById('current-lyric');
        const nextLyricEl = document.getElementById('next-lyric');
        const prevLyricText = document.getElementById('prev-lyric-text');
        const prevLyricBadge = document.getElementById('prev-lyric-badge');
        
        const scoreDisplay = document.getElementById('score-display');
        const comboDisplay = document.getElementById('combo-display');
        const hudPanel = document.getElementById('hud-panel');
        const micDebugPanel = document.getElementById('mic-debug-panel');
        const micDebugText = document.getElementById('mic-debug-text');
        const micStatusDot = document.getElementById('mic-status-dot');
        const syncDisplay = document.getElementById('sync-display');

        function extractVideoId(url) {
            const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
            const match = url.match(regex);
            return match ? match[1] : null;
        }

        async function fetchVideoTitle(vidId) {
            try {
                const res = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${vidId}`);
                const data = await res.json();
                return data.title || "";
            } catch (e) { return ""; }
        }

        async function fetchLyricsFromPublicDB(title) {
            const cleanTitle = title.replace(/\([^)]*\)|\[[^\]]*\]|video|oficial|official|lyric|lyrics|audio|remastered|karaoke/gi, '').trim();
            const response = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(cleanTitle)}`);
            if (!response.ok) throw new Error("Servidor de letras no disponible.");
            
            const data = await response.json();
            const track = data.find(t => t.syncedLyrics);
            if (!track) throw new Error("Letra no encontrada. Usa el campo 'Nombre Canción' para ayudar al buscador.");
            
            return track.syncedLyrics;
        }

        function parseLRC(lrcText) {
            const lines = lrcText.split('\n');
            const result = [];
            const regex = /\[(\d{2}):(\d{2}(?:\.\d{1,3})?)\](.*)/;
            
            lines.forEach(line => {
                const match = line.match(regex);
                if (match) {
                    const time = (parseInt(match[1]) * 60) + parseFloat(match[2]);
                    const text = match[3].trim();
                    if (text) {
                        result.push({ 
                            time: time, 
                            text: text,
                            words: text.split(/\s+/).filter(w => w.length > 0)
                        });
                    }
                }
            });
            return result.sort((a, b) => a.time - b.time);
        }

        function showError(msg) {
            setupError.innerText = msg;
            setupError.classList.remove('hidden');
        }

        document.getElementById('btn-fetch').addEventListener('click', async () => {
            setupError.classList.add('hidden');
            const url = document.getElementById('youtube-url').value.trim();
            const manualQuery = document.getElementById('manual-query').value.trim();
            isVdjModeActive = document.getElementById('vdj-mode-toggle').checked;

            if (!url) return showError("Debes pegar un link de YouTube.");
            
            videoId = extractVideoId(url);
            if (!videoId) return showError("Enlace de YouTube no válido.");

            setupScreen.classList.add('hidden');
            loadingScreen.classList.remove('hidden');
            loadingScreen.classList.add('flex');

            try {
                let query = manualQuery || await fetchVideoTitle(videoId);
                document.getElementById('loading-text').innerText = `Buscando: ${query}...`;
                
                const rawLRC = await fetchLyricsFromPublicDB(query);
                lrcData = parseLRC(rawLRC);
                
                if (lrcData.length === 0) throw new Error("La letra recibida está vacía.");

                totalLines = lrcData.length;
                document.getElementById('loading-text').innerText = "Montando el Escenario...";
                setupYouTubePlayer();

            } catch (error) {
                loadingScreen.classList.add('hidden');
                loadingScreen.classList.remove('flex');
                setupScreen.classList.remove('hidden');
                showError(error.message);
            }
        });

        function setupYouTubePlayer() {
            document.getElementById('youtube-player-container').innerHTML = '<div id="yt-player"></div>';
            player = new YT.Player('yt-player', {
                height: '100%',
                width: '100%',
                videoId: videoId,
                playerVars: { 'autoplay': 0, 'controls': 0, 'disablekb': 1, 'fs': 0, 'modestbranding': 1, 'rel': 0 },
                events: { 
                    'onReady': (e) => {
                        e.target.setVolume(100); // Volumen al máximo por defecto
                        loadingScreen.classList.add('hidden');
                        loadingScreen.classList.remove('flex');
                        karaokeScreen.classList.remove('hidden');
                        
                        resetGame();
                        if (isVdjModeActive) {
                            hudPanel.classList.add('hidden');
                            micDebugPanel.classList.add('hidden');
                        }
                    },
                    'onStateChange': (e) => {
                        if (e.data === YT.PlayerState.ENDED) showResults();
                    }
                }
            });
        }

        document.getElementById('btn-start-karaoke').addEventListener('click', () => {
            startOverlay.classList.add('hidden');
            player.playVideo();
            
            if (!isVdjModeActive) initMicForScoring();
            syncLoop(); 
        });

        function syncLoop() {
            if (isPaused) return;

            if (player && player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING) {
                const currentTime = player.getCurrentTime() + syncOffset;
                
                let newIndex = -1;
                for (let i = 0; i < lrcData.length; i++) {
                    if (currentTime >= lrcData[i].time) newIndex = i;
                    else break;
                }

                if (newIndex !== currentLineIndex && newIndex >= 0) {
                    if (currentLineIndex >= 0 && !isVdjModeActive) evaluateLineScore();

                    currentLineIndex = newIndex;
                    renderCurrentLine(newIndex);
                    nextLyricEl.innerText = lrcData[currentLineIndex + 1] ? lrcData[currentLineIndex + 1].text : "";
                    
                    wordsSaidInLine.clear();
                }

                // Efecto Karaoke Fill (Ilumina palabra por palabra)
                if (currentLineIndex >= 0 && lrcData[currentLineIndex + 1]) {
                    const startT = lrcData[currentLineIndex].time;
                    const endT = lrcData[currentLineIndex + 1].time;
                    const progress = Math.min(Math.max((currentTime - startT) / (endT - startT), 0), 1);
                    
                    const spans = currentLyricEl.querySelectorAll('span');
                    const fillCount = Math.floor(progress * spans.length);
                    
                    spans.forEach((span, idx) => {
                        if (idx < fillCount) span.classList.add('word-filled');
                        else span.classList.remove('word-filled');
                    });
                }
            }
            animationFrameId = requestAnimationFrame(syncLoop);
        }

        function renderCurrentLine(index) {
            currentLyricEl.innerHTML = '';
            lrcData[index].words.forEach(word => {
                const span = document.createElement('span');
                span.innerText = word;
                currentLyricEl.appendChild(span);
                // Añadir espacio literal para evitar amontonamiento CSS
                currentLyricEl.appendChild(document.createTextNode(' ')); 
            });
        }

        function evaluateLineScore() {
            const line = lrcData[currentLineIndex];
            const targetWords = line.words.length;
            if (targetWords === 0) return;

            let percentage = wordsSaidInLine.size / targetWords;
            if (targetWords <= 3 && wordsSaidInLine.size >= 1) percentage = 1.0; // Bono frases cortas

            let badgeHtml = "";
            let earnedPts = 0;

            if (percentage >= 0.8) {
                earnedPts = 300 * combo;
                badgeHtml = `<span class="badge badge-perfect">PERFECTO 🌟</span>`;
                combo++; linesHit++;
            } else if (percentage >= 0.5) {
                earnedPts = 200 * combo;
                badgeHtml = `<span class="badge badge-excellent">EXCELENTE 🔥</span>`;
                combo++; linesHit++;
            } else if (percentage >= 0.3) {
                earnedPts = 100 * combo;
                badgeHtml = `<span class="badge badge-good">BIEN 👍</span>`;
                combo = Math.min(combo + 1, 5); linesHit++;
            } else {
                badgeHtml = `<span class="badge badge-miss">FALLO ❌</span>`;
                combo = 1;
            }

            score += earnedPts;
            scoreDisplay.innerText = score;
            comboDisplay.innerText = `Combo x${combo}`;
            
            // Mostrar Historial
            prevLyricText.innerText = line.text;
            prevLyricBadge.innerHTML = badgeHtml;
            
            if (earnedPts > 0) showFloatingText(`+${earnedPts}`);
        }

        function showFloatingText(text) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.innerText = text;
            el.style.right = '60px';
            el.style.top = '120px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1200);
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        function initMicForScoring() {
            if (!SpeechRecognition) {
                micDebugText.innerText = "Navegador no soporta micrófono.";
                micStatusDot.className = "w-3 h-3 rounded-full bg-red-500";
                return;
            }
            
            recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.continuous = true;
            recognition.interimResults = true;

            const normalize = str => str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^\w\s]/gi, '').toLowerCase();

            recognition.onresult = (event) => {
                if (currentLineIndex < 0 || isPaused) return;
                
                let transcript = "";
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    transcript += event.results[i][0].transcript;
                }
                
                micDebugText.innerText = transcript || "...";
                micStatusDot.className = "w-3 h-3 rounded-full bg-green-500 animate-pulse";
                
                const spoken = normalize(transcript).split(/\s+/);
                const targets = lrcData[currentLineIndex].words;

                targets.forEach((tWord, idx) => {
                    const cleanT = normalize(tWord);
                    if (cleanT.length < 2) return; 
                    
                    spoken.forEach(sWord => {
                        if (sWord.includes(cleanT) || cleanT.includes(sWord)) {
                            if (sWord.length >= cleanT.length / 2) wordsSaidInLine.add(idx);
                        }
                    });
                });
            };

            recognition.onerror = (e) => {
                micDebugText.innerText = `Error: ${e.error}. Revisa permisos.`;
                micStatusDot.className = "w-3 h-3 rounded-full bg-red-500";
            };
            
            recognition.onend = () => { 
                micStatusDot.className = "w-3 h-3 rounded-full bg-yellow-500";
                if (!isPaused && !karaokeScreen.classList.contains('hidden') && !isVdjModeActive) {
                    try { recognition.start(); } catch(e){} 
                }
            };
            
            try { recognition.start(); } catch(e){}
        }

        document.getElementById('btn-sync-m').addEventListener('click', () => { syncOffset -= 0.5; updateSyncDisplay(); });
        document.getElementById('btn-sync-p').addEventListener('click', () => { syncOffset += 0.5; updateSyncDisplay(); });
        
        function updateSyncDisplay() {
            syncDisplay.innerText = `${syncOffset >= 0 ? "+" : ""}${syncOffset.toFixed(1)}s`;
        }

        document.getElementById('btn-toggle-mic').addEventListener('click', () => {
            micDebugPanel.classList.toggle('hidden');
        });

        // Pausa con Temporizador 3-2-1
        document.getElementById('btn-pause').addEventListener('click', () => {
            if (isPaused) return; 
            
            isPaused = true;
            player.pauseVideo();
            cancelAnimationFrame(animationFrameId);
            if(recognition) recognition.stop();
            
            const btn = document.getElementById('btn-pause');
            btn.innerHTML = '<i class="fas fa-play"></i>';
            btn.classList.replace('from-yellow-600', 'from-green-600');
            btn.classList.replace('to-yellow-500', 'to-green-500');
            
            btn.onclick = () => {
                btn.onclick = null; 
                countdownScreen.classList.remove('hidden');
                let count = 3;
                document.getElementById('countdown-number').innerText = count;
                
                const interval = setInterval(() => {
                    count--;
                    if (count > 0) document.getElementById('countdown-number').innerText = count;
                    else {
                        clearInterval(interval);
                        countdownScreen.classList.add('hidden');
                        resumeGame();
                    }
                }, 1000);
            };
        });

        function resumeGame() {
            isPaused = false;
            player.playVideo();
            const btn = document.getElementById('btn-pause');
            btn.innerHTML = '<i class="fas fa-pause"></i>';
            btn.classList.replace('from-green-600', 'from-yellow-600');
            btn.classList.replace('to-green-500', 'to-yellow-500');
            
            btn.onclick = () => btn.click();
            if (!isVdjModeActive) try { recognition.start(); } catch(e){}
            syncLoop();
        }

        // Finalización
        function showResults() {
            cancelAnimationFrame(animationFrameId);
            if(recognition) recognition.stop();
            
            let acc = totalLines > 0 ? Math.round((linesHit / totalLines) * 100) : 0;
            document.getElementById('res-score').innerText = score;
            document.getElementById('res-accuracy').innerText = `${acc}%`;
            document.getElementById('res-hits').innerText = `${linesHit} / ${totalLines}`;
            
            karaokeScreen.classList.add('hidden');
            resultsScreen.classList.remove('hidden');
            resultsScreen.classList.add('flex');
        }

        function resetGame() {
            score = 0; combo = 1; totalLines = 0; linesHit = 0;
            scoreDisplay.innerText = "0";
            comboDisplay.innerText = "Combo x1";
            prevLyricText.innerText = "...";
            prevLyricBadge.innerHTML = "";
            micDebugText.innerText = "Esperando voz...";
            currentLyricEl.innerHTML = "<span>Prepara tu voz...</span>";
            nextLyricEl.innerText = "Presiona Comenzar";
        }

        document.getElementById('btn-restart').addEventListener('click', () => {
            resultsScreen.classList.add('hidden');
            resultsScreen.classList.remove('flex');
            setupScreen.classList.remove('hidden');
            if(player && player.destroy) player.destroy();
        });

        document.getElementById('btn-exit').addEventListener('click', () => {
            cancelAnimationFrame(animationFrameId);
            if(recognition) recognition.stop();
            if(player && player.destroy) player.destroy();
            karaokeScreen.classList.add('hidden');
            setupScreen.classList.remove('hidden');
        });
    </script>
</body>
</html>
