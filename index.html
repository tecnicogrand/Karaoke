<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke Autónomo Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap');
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #050505;
            color: white;
            overflow: hidden; 
        }

        .lyric-line {
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            text-shadow: 2px 2px 10px rgba(0,0,0,0.9);
        }
        
        .lyric-active {
            color: #fbbf24;
            font-size: 4rem;
            line-height: 1.1;
            text-shadow: 0 0 25px rgba(251, 191, 36, 0.7), 2px 2px 15px rgba(0,0,0,1);
            transform: scale(1.05);
        }

        .lyric-next {
            color: rgba(255, 255, 255, 0.3);
            font-size: 2.2rem;
            margin-top: 1.5rem;
        }

        .lyric-success {
            color: #4ade80 !important;
            text-shadow: 0 0 40px rgba(74, 222, 128, 0.9), 0 0 15px rgba(0,0,0,1) !important;
            transform: scale(1.1);
        }

        #youtube-player-container {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 120vw; /* Ligeramente más grande para evitar bordes negros */
            height: 120vh;
            transform: translate(-50%, -50%);
            z-index: -2;
            pointer-events: none;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.9) 100%);
            z-index: -1;
        }

        .idle-hide { opacity: 0; transition: opacity 0.5s ease; pointer-events: none; }
        .idle-show { opacity: 1; transition: opacity 0.5s ease; }
        
        .loader {
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: #3b82f6;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .floating-score {
            position: absolute;
            color: #4ade80;
            font-size: 3rem;
            font-weight: 900;
            text-shadow: 0 0 20px rgba(74,222,128,0.8);
            animation: floatUpAndFade 1s forwards ease-out;
            pointer-events: none;
            z-index: 50;
        }
        @keyframes floatUpAndFade {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(1.5); }
        }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center relative">

    <div id="hud-panel" class="hidden absolute top-6 right-8 z-40 bg-black/40 backdrop-blur-md border border-white/10 rounded-2xl p-4 flex gap-6 shadow-2xl">
        <div class="flex flex-col items-center">
            <span class="text-xs text-gray-400 uppercase tracking-widest font-bold">Puntos</span>
            <span id="score-display" class="text-3xl text-blue-400 font-black">0</span>
        </div>
        <div class="w-[2px] bg-white/10"></div>
        <div class="flex flex-col items-center">
            <span class="text-xs text-gray-400 uppercase tracking-widest font-bold">Combo</span>
            <span id="combo-display" class="text-3xl text-yellow-400 font-black">x1</span>
        </div>
    </div>
    
    <div id="floating-score-container" class="absolute top-1/4 left-1/2 transform -translate-x-1/2 z-50"></div>

    <section id="setup-screen" class="bg-black/60 backdrop-blur-xl p-8 md:p-10 rounded-3xl shadow-2xl w-full max-w-xl z-10 border border-white/10">
        <h1 class="text-4xl font-black mb-2 text-center bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-indigo-500 drop-shadow-md">
            <i class="fas fa-microphone-alt text-blue-400"></i> Smart Karaoke Pro
        </h1>
        <p class="text-center text-slate-400 text-sm mb-8 font-bold tracking-wide">Base de datos abierta y motor interpolado</p>
        
        <div class="space-y-6">
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1">Enlace del Video (Obligatorio)</label>
                <input type="text" id="youtube-url" class="w-full bg-slate-900/80 border border-slate-600 rounded-xl px-5 py-4 text-white focus:outline-none focus:border-blue-500 transition-colors text-lg" placeholder="https://www.youtube.com/watch?v=...">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1">Artista y Canción (Opcional)</label>
                <input type="text" id="manual-query" class="w-full bg-slate-900/80 border border-slate-600 rounded-xl px-5 py-4 text-white focus:outline-none focus:border-indigo-500 transition-colors text-lg" placeholder="Ej: Luis Miguel La Incondicional">
                <p class="text-xs text-slate-500 mt-2 ml-1">Llena esto solo si el sistema no encuentra la letra usando el enlace.</p>
            </div>
            
            <div id="error-msg" class="hidden bg-red-900/50 border border-red-500 text-red-200 text-sm p-4 rounded-xl text-center font-bold"></div>

            <button id="btn-fetch" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-black text-xl py-4 rounded-xl transition-all shadow-[0_0_20px_rgba(79,70,229,0.4)] mt-2 uppercase tracking-wide">
                Preparar Escenario
            </button>
        </div>
    </section>

    <section id="loading-screen" class="hidden flex-col items-center justify-center z-10">
        <div class="loader mb-6"></div>
        <p id="loading-text" class="text-2xl font-bold text-blue-300 text-center animate-pulse drop-shadow-lg">Conectando...</p>
    </section>

    <main id="karaoke-screen" class="hidden w-full h-full relative flex flex-col justify-center items-center">
        <div id="youtube-player-container"></div>
        <div class="overlay"></div>

        <div id="start-overlay" class="absolute inset-0 flex items-center justify-center bg-black/80 z-30 backdrop-blur-sm">
            <button id="btn-start-karaoke" class="bg-gradient-to-br from-green-400 to-emerald-600 hover:scale-105 text-white font-black text-4xl py-8 px-12 rounded-[3rem] shadow-[0_0_40px_rgba(16,185,129,0.5)] transition-all uppercase tracking-widest border border-green-300/30">
                <i class="fas fa-play mr-3"></i> Cantar
            </button>
        </div>

        <div id="lyrics-container" class="text-center w-11/12 max-w-6xl z-10 flex flex-col items-center justify-center h-full pb-20">
            <div id="current-lyric" class="lyric-line lyric-active w-full px-4">...</div>
            <div id="next-lyric" class="lyric-line lyric-next w-full px-4 line-clamp-2">...</div>
        </div>

        <footer id="controls-panel" class="absolute bottom-8 left-1/2 transform -translate-x-1/2 bg-black/60 backdrop-blur-xl rounded-full p-3 flex items-center gap-3 idle-show z-40 border border-white/10 shadow-2xl w-[90%] max-w-3xl justify-between">
            <div class="flex gap-2">
                <button id="btn-sync-m5" class="px-4 py-3 bg-slate-800 hover:bg-slate-700 rounded-full text-sm font-bold text-white transition">-5s</button>
                <button id="btn-sync-m" class="px-4 py-3 bg-slate-800 hover:bg-slate-700 rounded-full text-sm font-bold text-white transition">-0.5s</button>
            </div>
            
            <div class="flex flex-col items-center justify-center px-4 pointer-events-none">
                <span class="text-[10px] text-gray-400 uppercase tracking-widest font-black">Sync (Calibrar)</span>
                <span id="sync-display" class="font-mono font-bold text-blue-400 text-xl">0.0s</span>
            </div>
            
            <div class="flex gap-2">
                <button id="btn-sync-p" class="px-4 py-3 bg-slate-800 hover:bg-slate-700 rounded-full text-sm font-bold text-white transition">+0.5s</button>
                <button id="btn-sync-p5" class="px-4 py-3 bg-slate-800 hover:bg-slate-700 rounded-full text-sm font-bold text-white transition">+5s</button>
            </div>
            
            <div class="w-[2px] h-10 bg-white/10 mx-2"></div>
            
            <button id="btn-exit" class="px-6 py-3 bg-red-900/80 hover:bg-red-600 rounded-full text-sm font-black text-white shadow-lg transition uppercase tracking-wider"><i class="fas fa-sign-out-alt mr-2"></i> Salir</button>
        </footer>
    </main>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // Variables de estado principal
        let lrcData = [];
        let currentLineIndex = -1;
        let player;
        let videoId = "";
        let syncOffset = 0; 
        let animationFrameId;
        
        // Variables de Puntuación
        let score = 0;
        let combo = 1;
        let currentLineScored = false;

        // Variables de Interpolación (High-Res Timer)
        let lastYTTime = 0;
        let lastPerformanceTime = performance.now();
        
        const ui = {
            setup: document.getElementById('setup-screen'),
            load: document.getElementById('loading-screen'),
            karaoke: document.getElementById('karaoke-screen'),
            overlay: document.getElementById('start-overlay'),
            loadTxt: document.getElementById('loading-text'),
            curLyric: document.getElementById('current-lyric'),
            nxtLyric: document.getElementById('next-lyric'),
            syncDisp: document.getElementById('sync-display'),
            controls: document.getElementById('controls-panel'),
            errorMsg: document.getElementById('error-msg'),
            hud: document.getElementById('hud-panel'),
            scoreDisp: document.getElementById('score-display'),
            comboDisp: document.getElementById('combo-display'),
            floatingContainer: document.getElementById('floating-score-container')
        };
        
        function showError(msg) {
            ui.errorMsg.innerHTML = `<i class="fas fa-exclamation-triangle mr-2"></i> ${msg}`;
            ui.errorMsg.classList.remove('hidden');
        }
        function hideError() { ui.errorMsg.classList.add('hidden'); }

        function extractVideoId(url) {
            const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
            const match = url.match(regex);
            return match ? match[1] : null;
        }

        async function fetchVideoTitle(vidId) {
            try {
                const response = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${vidId}`);
                const data = await response.json();
                return data.title || "";
            } catch (e) { return ""; }
        }

        async function fetchLyricsFromPublicDB(autoTitle, manualQuery) {
            let searchQuery = manualQuery.trim() !== "" ? manualQuery.trim() : "";

            if (!searchQuery) {
                let cleanTitle = autoTitle.toLowerCase();
                cleanTitle = cleanTitle.replace(/\([^)]*\)|\[[^\]]*\]/g, ' ');
                const stopWords = ['official', 'video', 'oficial', 'lyrics', 'lyric', 'letra', 'audio', 'remastered', '4k', 'hd', 'feat.', 'ft.', 'remix', 'music'];
                const regex = new RegExp(`\\b(${stopWords.join('|')})\\b`, 'gi');
                cleanTitle = cleanTitle.replace(regex, ' ').replace(/[-|&]/g, ' ').replace(/\s{2,}/g, ' ').trim();
                searchQuery = cleanTitle;
            }

            if (!searchQuery) throw new Error("No se pudo generar un texto de búsqueda válido.");

            const url = `https://lrclib.net/api/search?q=${encodeURIComponent(searchQuery)}`;
            
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("Fallo al contactar la base de datos.");
                const data = await response.json();
                
                const track = data.find(t => t.syncedLyrics);
                if (!track) throw new Error(`No se encontró letra para "${searchQuery}". Usa el recuadro opcional con el artista y canción.`);
                return track.syncedLyrics;
            } catch (err) {
                throw new Error(err.message || "Error de red al buscar la letra.");
            }
        }

        function parseLRC(lrcText) {
            const lines = lrcText.split('\n');
            const result = [];
            const regex = /\[(\d{2,}):(\d{2}(?:\.\d{1,3})?)\](.*)/;
            
            lines.forEach(line => {
                const match = line.match(regex);
                if (match) {
                    const timeInSeconds = (parseInt(match[1], 10) * 60) + parseFloat(match[2]);
                    const text = match[3].trim();
                    if (text !== "") result.push({ time: timeInSeconds, text: text });
                }
            });
            return result.sort((a, b) => a.time - b.time);
        }

        document.getElementById('btn-fetch').addEventListener('click', async () => {
            hideError();
            const url = document.getElementById('youtube-url').value.trim();
            const manualQ = document.getElementById('manual-query').value.trim();

            if (!url) return showError("Debes ingresar un enlace de YouTube.");
            videoId = extractVideoId(url);
            if (!videoId) return showError("El enlace de YouTube no es válido.");

            ui.setup.classList.add('hidden');
            ui.load.classList.remove('hidden');
            ui.load.classList.add('flex');

            try {
                ui.loadTxt.innerText = "Preparando escenario...";
                let videoTitle = manualQ ? "" : await fetchVideoTitle(videoId);
                
                ui.loadTxt.innerText = "Sincronizando letras...";
                const rawLRC = await fetchLyricsFromPublicDB(videoTitle, manualQ);
                
                lrcData = parseLRC(rawLRC);
                if (lrcData.length === 0) throw new Error("Archivo de letras vacío.");

                setupYouTubePlayer();
            } catch (error) {
                showError(error.message);
                ui.load.classList.add('hidden');
                ui.load.classList.remove('flex');
                ui.setup.classList.remove('hidden');
            }
        });

        function setupYouTubePlayer() {
            document.getElementById('youtube-player-container').innerHTML = '<div id="yt-player"></div>';
            player = new YT.Player('yt-player', {
                height: '100%',
                width: '100%',
                videoId: videoId,
                playerVars: { 'autoplay': 0, 'controls': 0, 'disablekb': 1, 'fs': 0, 'modestbranding': 1, 'rel': 0 },
                events: { 'onReady': onPlayerReady }
            });
        }

        function onPlayerReady(event) {
            ui.load.classList.add('hidden');
            ui.load.classList.remove('flex');
            ui.karaoke.classList.remove('hidden');
            
            syncOffset = 0;
            score = 0;
            combo = 1;
            updateHUD();
            updateSyncDisplay();
            
            currentLineIndex = -1;
            currentLineScored = false;
            ui.curLyric.innerText = "¡Prepara tu voz!";
            ui.nxtLyric.innerText = "Presiona Cantar";
        }

        function updateHUD() {
            ui.scoreDisp.innerText = score;
            ui.comboDisp.innerText = `x${combo}`;
            
            // Efecto visual al perder combo
            if (combo === 1 && score > 0) {
                ui.comboDisp.classList.remove('text-yellow-400');
                ui.comboDisp.classList.add('text-red-500');
                setTimeout(() => {
                    ui.comboDisp.classList.remove('text-red-500');
                    ui.comboDisp.classList.add('text-yellow-400');
                }, 500);
            }
        }

        function showFloatingScore(points) {
            const floatEl = document.createElement('div');
            floatEl.className = 'floating-score';
            floatEl.innerText = `+${points}`;
            
            // Randomize position slightly
            const offset = (Math.random() - 0.5) * 100;
            floatEl.style.left = `calc(50% + ${offset}px)`;
            
            ui.floatingContainer.appendChild(floatEl);
            setTimeout(() => { floatEl.remove(); }, 1000);
        }

        document.getElementById('btn-start-karaoke').addEventListener('click', () => {
            ui.overlay.classList.add('hidden');
            ui.hud.classList.remove('hidden'); // Mostrar HUD al iniciar
            player.playVideo();
            initMicForScoring(); 
            
            // Iniciar relojes para interpolación
            lastYTTime = player.getCurrentTime();
            lastPerformanceTime = performance.now();
            syncLoop(); 
        });

        function syncLoop() {
            if (player && player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING) {
                const currentYTTime = player.getCurrentTime();
                const now = performance.now();

                // YouTube actualiza `getCurrentTime` cada 250ms aprox.
                // Si el tiempo cambió, resincronizamos nuestro reloj de alta precisión.
                if (currentYTTime !== lastYTTime) {
                    lastYTTime = currentYTTime;
                    lastPerformanceTime = now;
                }

                // Calcular el tiempo exacto prediciendo los milisegundos entre actualizaciones de YouTube
                const interpolatedTime = lastYTTime + ((now - lastPerformanceTime) / 1000);
                const finalTime = interpolatedTime + syncOffset;
                
                let newIndex = -1;
                for (let i = 0; i < lrcData.length; i++) {
                    if (finalTime >= lrcData[i].time) {
                        newIndex = i;
                    } else { break; }
                }

                if (newIndex !== currentLineIndex && newIndex >= 0) {
                    // Si cambiamos de línea y la anterior NO fue puntuada, perdemos el combo
                    if (currentLineIndex >= 0 && !currentLineScored && lrcData[currentLineIndex].text.length > 2) {
                        combo = 1;
                        updateHUD();
                    }

                    currentLineIndex = newIndex;
                    currentLineScored = false; // Reset status para la nueva línea
                    
                    ui.curLyric.innerText = lrcData[currentLineIndex].text;
                    ui.curLyric.classList.remove('lyric-success');
                    ui.nxtLyric.innerText = lrcData[currentLineIndex + 1] ? lrcData[currentLineIndex + 1].text : "";
                }
            }
            animationFrameId = requestAnimationFrame(syncLoop);
        }

        function updateSyncDisplay() {
            const sign = syncOffset > 0 ? "+" : "";
            ui.syncDisp.innerText = `${sign}${syncOffset.toFixed(1)}s`;
        }

        document.getElementById('btn-sync-m5').addEventListener('click', () => { syncOffset -= 5; updateSyncDisplay(); });
        document.getElementById('btn-sync-m').addEventListener('click', () => { syncOffset -= 0.5; updateSyncDisplay(); });
        document.getElementById('btn-sync-p').addEventListener('click', () => { syncOffset += 0.5; updateSyncDisplay(); });
        document.getElementById('btn-sync-p5').addEventListener('click', () => { syncOffset += 5; updateSyncDisplay(); });

        document.getElementById('btn-exit').addEventListener('click', () => {
            cancelAnimationFrame(animationFrameId);
            if(player && player.destroy) player.destroy();
            ui.karaoke.classList.add('hidden');
            ui.hud.classList.add('hidden');
            ui.setup.classList.remove('hidden');
            ui.overlay.classList.remove('hidden');
            hideError();
        });

        let idleTimer;
        document.addEventListener('mousemove', () => {
            if (!ui.karaoke.classList.contains('hidden')) {
                ui.controls.classList.remove('idle-hide');
                ui.controls.classList.add('idle-show');
                clearTimeout(idleTimer);
                idleTimer = setTimeout(() => {
                    ui.controls.classList.remove('idle-show');
                    ui.controls.classList.add('idle-hide');
                }, 3500);
            }
        });

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        function initMicForScoring() {
            if (!SpeechRecognition) return; 
            try {
                recognition = new SpeechRecognition();
                recognition.lang = 'es-ES';
                recognition.continuous = true;
                recognition.interimResults = true;

                // Normalizador para quitar acentos y hacer coincidencia difusa (Fuzzy Match)
                const normalize = (str) => str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^\w\s]/gi, '').toLowerCase().replace(/\s+/g, '');

                recognition.onresult = (event) => {
                    if (currentLineIndex < 0 || !lrcData[currentLineIndex] || currentLineScored) return;
                    
                    let transcript = "";
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        transcript += event.results[i][0].transcript;
                    }
                    
                    const said = normalize(transcript);
                    const target = normalize(lrcData[currentLineIndex].text);

                    // Si la frase tiene más de 3 letras y detectamos al menos el 40%
                    if (target.length > 3 && said.includes(target.substring(0, Math.floor(target.length * 0.4)))) {
                        currentLineScored = true;
                        ui.curLyric.classList.add('lyric-success');
                        
                        // Añadir puntos
                        const earnedPoints = 100 * combo;
                        score += earnedPoints;
                        showFloatingScore(earnedPoints);
                        combo++;
                        updateHUD();
                    }
                };

                recognition.onerror = (e) => console.log("Mic error:", e.error);
                recognition.onend = () => { 
                    if (!ui.karaoke.classList.contains('hidden')) {
                        try { recognition.start(); } catch(e){} 
                    }
                };
                
                recognition.start(); 
            } catch(e) {
                console.log("Reconocimiento de voz no disponible.");
            }
        }
    </script>
</body>
</html>
