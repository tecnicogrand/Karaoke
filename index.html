<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke Inmersivo - YouTube Background</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Fredoka', sans-serif;
            background-color: #000;
            overflow: hidden; /* Evitar scroll */
        }

        /* Utilidades para los textos brillantes */
        .glow-text {
            text-shadow: 0 0 10px rgba(255,255,255,0.5), 0 0 30px rgba(255,255,255,0.3);
        }
        
        .correct-glow {
            animation: flashGreen 0.6s ease-out;
        }

        @keyframes flashGreen {
            0% { text-shadow: 0 0 20px rgba(34, 197, 94, 1), 0 0 40px rgba(34, 197, 94, 0.8); color: #4ade80; }
            100% { text-shadow: 0 0 10px rgba(255,255,255,0.5), 0 0 30px rgba(255,255,255,0.3); color: white; }
        }
        
        .lyric-transition {
            transition: all 0.3s ease-in-out;
        }

        .glass-panel {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Contenedor de YouTube para que actúe de fondo */
        .yt-background {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            transform: translate(-50%, -50%) scale(1.2); /* Escalar para quitar bordes negros */
            z-index: -20;
            pointer-events: none; /* Que no se pueda clickear */
        }
    </style>
</head>
<body class="text-white h-screen flex flex-col items-center justify-center relative">

    <!-- Contenedor del video de YouTube -->
    <div id="player" class="yt-background"></div>
    
    <!-- Capa oscura semitransparente -->
    <div class="fixed inset-0 bg-black/60 z-[-10]"></div>

    <main class="z-10 flex flex-col items-center w-full max-w-4xl px-4 text-center h-full py-8 justify-between">
        
        <!-- Cabecera: Título y Puntuación -->
        <header class="w-full flex flex-col items-center mt-4">
            <div class="flex justify-between items-center w-full max-w-3xl mb-4 px-4">
                <h1 class="text-3xl text-pink-400 font-bold tracking-widest uppercase drop-shadow-lg">🎤 Cielito Lindo</h1>
                <div class="glass-panel px-6 py-2 rounded-full flex items-center gap-3 shadow-lg">
                    <span class="text-gray-300 text-sm uppercase tracking-wider font-semibold">Score</span>
                    <span id="score-display" class="text-4xl font-bold text-yellow-400 drop-shadow-md transition-all duration-300">0</span>
                </div>
            </div>
            
            <!-- Barra de Progreso -->
            <div class="w-full max-w-3xl bg-gray-900/80 h-3 rounded-full overflow-hidden border border-gray-700 shadow-inner mt-2">
                <div id="progress-bar" class="bg-gradient-to-r from-pink-500 via-purple-500 to-cyan-500 h-full w-0 transition-all duration-500 ease-out"></div>
            </div>
        </header>

        <div class="w-full max-w-4xl flex flex-col justify-center items-center flex-1 my-8">
            <div id="lyric-container" class="glass-panel rounded-3xl p-8 md:p-14 shadow-[0_0_40px_rgba(0,0,0,0.5)] w-full relative overflow-hidden flex flex-col items-center justify-center min-h-[300px]">
                
                <div id="status-indicator" class="absolute top-4 right-6 flex items-center gap-2 hidden">
                    <span class="relative flex h-3 w-3">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
                    </span>
                    <span class="text-xs text-red-400 font-bold uppercase tracking-wider">Escuchando</span>
                </div>

                <h2 id="current-line" class="text-5xl md:text-7xl font-bold glow-text lyric-transition mb-8 text-white leading-tight">
                    Cargando Video...
                </h2>
                <h3 id="next-line" class="text-2xl md:text-4xl font-medium text-gray-400 lyric-transition opacity-80">
                    Por favor espera
                </h3>
            </div>
        </div>

        <div class="w-full max-w-3xl flex flex-col items-center mb-8 gap-6">
            
            <!-- Transcripción en vivo -->
            <div class="w-full glass-panel rounded-2xl p-5 border border-white/10 relative">
                <div class="absolute -top-3 left-6 bg-gray-800 px-3 text-xs text-pink-400 uppercase tracking-widest font-semibold border border-pink-500/30 rounded-full">
                    Micrófono en vivo
                </div>
                <p id="live-transcript" class="text-xl md:text-2xl font-medium text-gray-300 min-h-[40px] italic">
                    Esperando a que inicies...
                </p>
            </div>

            <!-- Controles -->
            <div class="flex gap-4">
                <button id="start-btn" disabled class="px-8 py-3 bg-gradient-to-r from-green-500 to-emerald-600 rounded-full font-bold text-xl shadow-[0_0_15px_rgba(16,185,129,0.5)] hover:scale-105 transition-all duration-300 flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                    ▶️ Empezar
                </button>
                <button id="stop-btn" class="px-8 py-3 bg-gradient-to-r from-red-600 to-rose-700 rounded-full font-bold text-xl shadow-[0_0_15px_rgba(225,29,72,0.5)] hover:scale-105 transition-all duration-300 flex items-center gap-2 hidden">
                    ⏹️ Detener
                </button>
            </div>

            <div id="error-container" class="hidden bg-red-900/80 border border-red-500 text-red-200 px-6 py-3 rounded-xl max-w-lg text-sm text-center"></div>
        </div>

    </main>

    <script>
        // --- VARIABLES DE ESTADO ---
        let player;
        let isYouTubeReady = false;
        let isRecording = false;
        let currentIndex = 0;
        let score = 0;
        let speechBuffer = "";
        let recognition = null;

        // La letra
        const lyrics = [
            "De la sierra morena",
            "Cielito lindo vienen bajando",
            "Un par de ojitos negros",
            "Cielito lindo de contrabando",
            "Ay ay ay ay",
            "Canta y no llores",
            "Porque cantando se alegran",
            "Cielito lindo los corazones"
        ];

        // Elementos UI
        const currentLineEl = document.getElementById('current-line');
        const nextLineEl = document.getElementById('next-line');
        const liveTranscriptEl = document.getElementById('live-transcript');
        const scoreDisplay = document.getElementById('score-display');
        const progressBar = document.getElementById('progress-bar');
        const statusIndicator = document.getElementById('status-indicator');
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const errorContainer = document.getElementById('error-container');

        // --- 1. CONFIGURACIÓN YOUTUBE API ---
        // Cargar script dinámicamente como lo pide Google
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        // Función global llamada por la API de YT cuando está lista
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: 'IixcM20oJq8', // Video instrumental
                playerVars: {
                    'autoplay': 0,
                    'controls': 0, // Sin controles
                    'disablekb': 1,
                    'fs': 0,
                    'modestbranding': 1,
                    'rel': 0,
                    'showinfo': 0,
                    'mute': 0 
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        function onPlayerReady(event) {
            isYouTubeReady = true;
            currentLineEl.textContent = "¡Listo para cantar!";
            nextLineEl.textContent = "Presiona 'Empezar'";
            startBtn.disabled = false; // Habilitar botón
        }

        // --- STREAMING_CHUNK:Configuración Web Speech API... ---
        document.addEventListener('DOMContentLoaded', () => {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                showError("Tu navegador no soporta reconocimiento de voz. Usa Chrome de escritorio.");
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'es-ES'; 
            recognition.continuous = true; 
            recognition.interimResults = true; 

            // Normalizador de texto (ignora acentos y puntuación)
            const normalizeText = (text) => {
                return text.toLowerCase()
                    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                    .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()¿?¡!]/g,"")
                    .replace(/\s{2,}/g," ")
                    .trim();
            };

            // Lógica de avance
            const advanceLine = () => {
                // Efecto visual
                currentLineEl.classList.remove('correct-glow');
                void currentLineEl.offsetWidth; 
                currentLineEl.classList.add('correct-glow');
                
                score += 150;
                scoreDisplay.textContent = score;
                scoreDisplay.classList.add('scale-150', 'text-white');
                setTimeout(() => scoreDisplay.classList.remove('scale-150', 'text-white'), 300);

                currentIndex++;
                speechBuffer = ""; // Limpiar buffer
                liveTranscriptEl.textContent = "...";

                // Barra progreso
                const progress = (currentIndex / lyrics.length) * 100;
                progressBar.style.width = `${progress}%`;

                if (currentIndex >= lyrics.length) {
                    currentLineEl.textContent = "¡Increíble! 🎉";
                    nextLineEl.textContent = `Puntaje final: ${score}`;
                    currentLineEl.classList.replace('text-white', 'text-yellow-400');
                    stopKaraoke();
                } else {
                    currentLineEl.textContent = lyrics[currentIndex];
                    nextLineEl.textContent = lyrics[currentIndex + 1] || "";
                }
            };

            // --- STREAMING_CHUNK:Lógica Fuzzy Match... ---
            const checkMatch = (heardText) => {
                if (currentIndex >= lyrics.length) return;

                const targetLine = lyrics[currentIndex];
                const normHeard = normalizeText(heardText);
                const normTarget = normalizeText(targetLine);

                if (!normHeard) return;

                // 1. Unión sin espacios
                const heardNoSpaces = normHeard.replace(/\s+/g, '');
                const targetNoSpaces = normTarget.replace(/\s+/g, '');
                
                if (heardNoSpaces.includes(targetNoSpaces)) {
                    advanceLine();
                    return;
                }

                // 2. Coincidencia del 75%
                const targetWords = normTarget.split(' ').filter(w => w.length > 0);
                const heardWords = normHeard.split(' ');
                
                let matchCount = 0;
                targetWords.forEach(word => {
                    if (heardWords.includes(word) || normHeard.includes(word)) {
                        matchCount++;
                    }
                });

                if (targetWords.length > 0 && (matchCount / targetWords.length) >= 0.75) {
                    advanceLine();
                }
            };

            // Eventos de Voz
            recognition.onstart = () => {
                isRecording = true;
                statusIndicator.classList.remove('hidden');
            };

            recognition.onresult = (event) => {
                if (currentIndex >= lyrics.length || !isRecording) return;

                let interimTranscript = '';
                let finalTranscriptThisLoop = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscriptThisLoop += event.results[i][0].transcript + ' ';
                    } else {
                        interimTranscript += event.results[i][0].transcript + ' ';
                    }
                }

                if (finalTranscriptThisLoop) {
                    speechBuffer += finalTranscriptThisLoop;
                }

                const fullStringToEvaluate = speechBuffer + interimTranscript;
                liveTranscriptEl.textContent = fullStringToEvaluate.trim() ? `"${fullStringToEvaluate.trim()}"` : "...";
                
                checkMatch(fullStringToEvaluate);
            };

            recognition.onend = () => {
                statusIndicator.classList.add('hidden');
                // Auto reinicio si no hemos parado manual y no ha acabado la canción
                if (isRecording && currentIndex < lyrics.length) {
                    try { recognition.start(); } catch(e){}
                } else {
                    isRecording = false;
                }
            };

            recognition.onerror = (event) => {
                if (event.error === 'not-allowed') {
                    showError("Acceso al micrófono denegado.");
                    stopKaraoke();
                }
            };

            // --- STREAMING_CHUNK:Control de botones y UI... ---
            function startKaraoke() {
                if (!isYouTubeReady || !recognition) return;
                
                // Si la canción ya terminó antes, reiniciar todo
                if (currentIndex >= lyrics.length) {
                    currentIndex = 0;
                    score = 0;
                    scoreDisplay.textContent = "0";
                    progressBar.style.width = "0%";
                    currentLineEl.classList.replace('text-yellow-400', 'text-white');
                    player.seekTo(0);
                }

                currentLineEl.textContent = lyrics[currentIndex];
                nextLineEl.textContent = lyrics[currentIndex + 1] || "";
                liveTranscriptEl.textContent = "¡Canta ahora!";
                speechBuffer = "";

                // Iniciar Audio y Video
                player.playVideo();
                try { recognition.start(); } catch(e){}
                
                // Actualizar Botones
                startBtn.classList.add('hidden');
                stopBtn.classList.remove('hidden');
            }

            function stopKaraoke() {
                isRecording = false;
                if (player && typeof player.pauseVideo === 'function') player.pauseVideo();
                try { recognition.stop(); } catch(e){}
                
                statusIndicator.classList.add('hidden');
                startBtn.classList.remove('hidden');
                stopBtn.classList.add('hidden');
                startBtn.innerHTML = "▶️ Reanudar";
            }

            function showError(msg) {
                errorContainer.textContent = msg;
                errorContainer.classList.remove('hidden');
            }

            startBtn.addEventListener('click', startKaraoke);
            stopBtn.addEventListener('click', stopKaraoke);
        });
    </script>
</body>
</html>
