<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Karaoke Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap');
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #050505;
            color: white;
            overflow: hidden; 
        }

        .lyric-line {
            /* Se quitó el transform para evitar saltos en el layout */
            transition: opacity 0.3s ease;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.9));
            text-align: center;
        }
        
        .lyric-active {
            font-size: 3.5rem;
            line-height: 1.3;
        }

        .lyric-word {
            color: rgba(255, 255, 255, 0.3); 
            /* Se quitó transform para evitar que las palabras se amontonen */
            transition: color 0.15s ease, text-shadow 0.15s ease;
            display: inline-block;
        }

        /* Clase dinámica que se añade palabra por palabra por tiempo */
        .lyric-word.filled {
            color: #4ade80; /* Verde esmeralda */
            text-shadow: 0 0 15px rgba(74, 222, 128, 0.6);
        }

        .lyric-next {
            color: rgba(255, 255, 255, 0.4);
            font-size: 2rem;
            margin-top: 1.5rem;
        }

        /* Brillo extra al acertar la frase (micrófono) */
        .lyric-active.success .lyric-word {
            color: #fbbf24 !important; /* Cambia toda la frase a dorado */
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.8), 2px 4px 6px rgba(0,0,0,0.9) !important;
        }

        #youtube-player-container {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 120vw;
            height: 120vh;
            transform: translate(-50%, -50%);
            z-index: -2;
            pointer-events: none;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.95) 100%);
            z-index: -1;
        }

        .idle-hide { opacity: 0; transition: opacity 0.5s ease; pointer-events: none; }
        .idle-show { opacity: 1; transition: opacity 0.5s ease; }
        
        .loader {
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: #3b82f6;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .floating-score {
            position: absolute;
            color: #fbbf24;
            font-size: 3rem;
            font-weight: 900;
            filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.8));
            animation: floatUpAndFade 1s forwards ease-out;
            pointer-events: none;
            z-index: 50;
        }
        @keyframes floatUpAndFade {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(1.2); }
        }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center relative">

    <!-- Monitor del Micrófono (Arriba Izquierda) -->
    <div id="mic-monitor" class="hidden absolute top-6 left-8 z-40 bg-black/60 backdrop-blur-md border border-blue-500/40 rounded-xl p-4 shadow-2xl max-w-md w-full transition-opacity duration-300">
        <div class="flex items-center text-blue-400 mb-2 border-b border-blue-500/20 pb-2">
            <i class="fas fa-microphone-alt animate-pulse mr-2"></i>
            <span class="text-xs font-bold uppercase tracking-widest">Escuchando en vivo...</span>
        </div>
        <p id="mic-monitor-text" class="text-white text-base font-medium italic min-h-[3rem]">...</p>
    </div>

    <!-- HUD Puntuación (Arriba Derecha) -->
    <div id="hud-panel" class="hidden absolute top-6 right-8 z-40 bg-black/50 backdrop-blur-md border border-white/10 rounded-2xl p-4 flex gap-6 shadow-2xl">
        <div class="flex flex-col items-center">
            <span class="text-xs text-gray-400 uppercase tracking-widest font-bold">Puntos</span>
            <span id="score-display" class="text-3xl text-blue-400 font-black">0</span>
        </div>
        <div class="w-[2px] bg-white/10"></div>
        <div class="flex flex-col items-center">
            <span class="text-xs text-gray-400 uppercase tracking-widest font-bold">Combo</span>
            <span id="combo-display" class="text-3xl text-yellow-400 font-black">x1</span>
        </div>
    </div>
    
    <div id="floating-score-container" class="absolute top-1/4 left-1/2 transform -translate-x-1/2 z-50"></div>

    <section id="setup-screen" class="bg-black/60 backdrop-blur-xl p-8 md:p-10 rounded-3xl shadow-2xl w-full max-w-xl z-10 border border-white/10">
        <h1 class="text-4xl font-black mb-2 text-center bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-indigo-500 drop-shadow-md">
            <i class="fas fa-music text-blue-400"></i> Karaoke Libre
        </h1>
        <p class="text-center text-slate-400 text-sm mb-8 font-bold tracking-wide">Base de datos LRCLIB. Sin API Keys.</p>
        
        <div class="space-y-6">
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1">Enlace de YouTube</label>
                <input type="text" id="youtube-url" class="w-full bg-slate-900/80 border border-slate-600 rounded-xl px-5 py-4 text-white focus:outline-none focus:border-blue-500 transition-colors text-lg" placeholder="https://www.youtube.com/watch?v=...">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1">Canción (Si falla automático)</label>
                <input type="text" id="manual-query" class="w-full bg-slate-900/80 border border-slate-600 rounded-xl px-5 py-4 text-white focus:outline-none focus:border-indigo-500 transition-colors text-lg" placeholder="Ej: Luis Miguel La Incondicional">
            </div>
            
            <div id="error-msg" class="hidden bg-red-900/80 border border-red-500 text-red-100 text-sm p-4 rounded-xl text-center font-bold shadow-lg"></div>

            <button id="btn-fetch" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-black text-xl py-4 rounded-xl transition-all shadow-[0_0_20px_rgba(79,70,229,0.4)] mt-2 uppercase tracking-wide">
                Generar Escenario
            </button>
        </div>
    </section>

    <section id="loading-screen" class="hidden flex-col items-center justify-center z-10">
        <div class="loader mb-6"></div>
        <p id="loading-text" class="text-2xl font-bold text-blue-300 text-center animate-pulse drop-shadow-lg">Conectando...</p>
    </section>

    <main id="karaoke-screen" class="hidden w-full h-full relative flex flex-col justify-center items-center">
        <div id="youtube-player-container"></div>
        <div class="overlay"></div>

        <div id="start-overlay" class="absolute inset-0 flex items-center justify-center bg-black/80 z-30 backdrop-blur-sm">
            <button id="btn-start-karaoke" class="bg-gradient-to-br from-green-400 to-emerald-600 hover:scale-105 text-white font-black text-4xl py-8 px-12 rounded-[3rem] shadow-[0_0_40px_rgba(16,185,129,0.5)] transition-all uppercase tracking-widest border border-green-300/30">
                <i class="fas fa-play mr-3"></i> Iniciar Canción
            </button>
        </div>

        <div id="lyrics-container" class="text-center w-11/12 max-w-6xl z-10 flex flex-col items-center justify-center h-full pb-20">
            <div id="current-lyric" class="lyric-line lyric-active w-full px-4">...</div>
            <div id="next-lyric" class="lyric-line lyric-next w-full px-4 line-clamp-2 mt-8">...</div>
        </div>

        <!-- Panel de Control Inferior -->
        <footer id="controls-panel" class="absolute bottom-8 left-1/2 transform -translate-x-1/2 bg-black/60 backdrop-blur-xl rounded-full p-3 flex items-center gap-3 idle-show z-40 border border-white/10 shadow-2xl w-[90%] max-w-3xl justify-between">
            <div class="flex gap-2">
                <button id="btn-sync-m5" class="px-4 py-3 bg-slate-800 hover:bg-slate-700 rounded-full text-sm font-bold text-white transition">-5s</button>
                <button id="btn-sync-m" class="px-4 py-3 bg-slate-800 hover:bg-slate-700 rounded-full text-sm font-bold text-white transition">-0.5s</button>
            </div>
            
            <div class="flex flex-col items-center justify-center px-4 pointer-events-none">
                <span class="text-[10px] text-gray-400 uppercase tracking-widest font-black">Sync (Calibrar)</span>
                <span id="sync-display" class="font-mono font-bold text-blue-400 text-xl">0.0s</span>
            </div>
            
            <div class="flex gap-2">
                <button id="btn-sync-p" class="px-4 py-3 bg-slate-800 hover:bg-slate-700 rounded-full text-sm font-bold text-white transition">+0.5s</button>
                <button id="btn-sync-p5" class="px-4 py-3 bg-slate-800 hover:bg-slate-700 rounded-full text-sm font-bold text-white transition">+5s</button>
            </div>
            
            <div class="w-[2px] h-10 bg-white/10 mx-2"></div>
            <button id="btn-exit" class="px-6 py-3 bg-red-900/80 hover:bg-red-600 rounded-full text-sm font-black text-white shadow-lg transition uppercase tracking-wider"><i class="fas fa-times"></i> Salir</button>
        </footer>
    </main>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // --- STREAMING_CHUNK:Initializing Application State Variables... ---
        let lrcData = [];
        let currentLineIndex = -1;
        let player;
        let videoId = "";
        let syncOffset = 0; 
        let animationFrameId;
        
        let score = 0;
        let combo = 1;
        // Puntos acumulados en la línea actual para aplicar la fórmula incremental
        let currentLineMaxPoints = 0; 

        let lastYTTime = 0;
        let lastPerformanceTime = performance.now();
        let micMonitorTimeout;
        
        const ui = {
            setup: document.getElementById('setup-screen'),
            load: document.getElementById('loading-screen'),
            karaoke: document.getElementById('karaoke-screen'),
            overlay: document.getElementById('start-overlay'),
            loadTxt: document.getElementById('loading-text'),
            curLyric: document.getElementById('current-lyric'),
            nxtLyric: document.getElementById('next-lyric'),
            syncDisp: document.getElementById('sync-display'),
            controls: document.getElementById('controls-panel'),
            errorMsg: document.getElementById('error-msg'),
            hud: document.getElementById('hud-panel'),
            scoreDisp: document.getElementById('score-display'),
            comboDisp: document.getElementById('combo-display'),
            floatingContainer: document.getElementById('floating-score-container'),
            micMonitor: document.getElementById('mic-monitor'),
            micText: document.getElementById('mic-monitor-text')
        };
        
        function showError(msg) {
            ui.errorMsg.innerHTML = `<i class="fas fa-exclamation-triangle mr-2"></i> ${msg}`;
            ui.errorMsg.classList.remove('hidden');
        }
        function hideError() { ui.errorMsg.classList.add('hidden'); }

        function extractVideoId(url) {
            const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
            const match = url.match(regex);
            return match ? match[1] : null;
        }

        // --- STREAMING_CHUNK:Fetching Lyrics and Video Data... ---
        async function fetchVideoTitle(vidId) {
            try {
                const response = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${vidId}`);
                const data = await response.json();
                return data.title || "";
            } catch (e) { return ""; }
        }

        async function fetchLyricsFromPublicDB(autoTitle, manualQuery) {
            let searchQuery = manualQuery.trim();

            if (!searchQuery) {
                let cleanTitle = autoTitle.toLowerCase();
                cleanTitle = cleanTitle.replace(/\([^)]*\)|\[[^\]]*\]/g, ' ');
                const stopWords = ['official', 'video', 'oficial', 'lyrics', 'lyric', 'letra', 'audio', 'remastered', '4k', 'hd', 'feat.', 'ft.', 'remix', 'music'];
                const regex = new RegExp(`\\b(${stopWords.join('|')})\\b`, 'gi');
                cleanTitle = cleanTitle.replace(regex, ' ').replace(/[-|&]/g, ' ').replace(/\s{2,}/g, ' ').trim();
                searchQuery = cleanTitle;
            }

            if (!searchQuery) throw new Error("Título confuso. Escribe la canción manualmente.");

            const url = `https://lrclib.net/api/search?q=${encodeURIComponent(searchQuery)}`;
            
            const response = await fetch(url);
            if (!response.ok) throw new Error("Error contactando la base de datos de letras (LRCLIB).");
            const data = await response.json();
            
            const track = data.find(t => t.syncedLyrics);
            if (!track) throw new Error(`No se encontró la letra sincronizada. Usa el campo "Canción" para buscar (Ej: "Artista Canción").`);
            return track.syncedLyrics;
        }

        function parseLRC(lrcText) {
            const lines = lrcText.split('\n');
            const result = [];
            const regex = /\[(\d{2,}):(\d{2}(?:\.\d{1,3})?)\](.*)/;
            
            lines.forEach(line => {
                const match = line.match(regex);
                if (match) {
                    const timeInSeconds = (parseInt(match[1], 10) * 60) + parseFloat(match[2]);
                    const text = match[3].trim();
                    if (text !== "") result.push({ time: timeInSeconds, text: text });
                }
            });
            return result.sort((a, b) => a.time - b.time);
        }

        // --- STREAMING_CHUNK:Initializing the Player... ---
        document.getElementById('btn-fetch').addEventListener('click', async () => {
            hideError();
            const url = document.getElementById('youtube-url').value.trim();
            const manualQ = document.getElementById('manual-query').value.trim();

            if (!url) return showError("Ingresa el enlace del video de YouTube.");
            videoId = extractVideoId(url);
            if (!videoId) return showError("Enlace inválido.");

            ui.setup.classList.add('hidden');
            ui.load.classList.remove('hidden');
            ui.load.classList.add('flex');

            try {
                ui.loadTxt.innerText = "Preparando escenario...";
                let videoTitle = manualQ ? "" : await fetchVideoTitle(videoId);
                
                ui.loadTxt.innerText = "Descargando letras sincronizadas...";
                const rawLRC = await fetchLyricsFromPublicDB(videoTitle, manualQ);
                
                lrcData = parseLRC(rawLRC);
                if (lrcData.length === 0) throw new Error("La canción no contiene marcas de tiempo.");

                setupYouTubePlayer();
            } catch (error) {
                showError(error.message);
                ui.load.classList.add('hidden');
                ui.load.classList.remove('flex');
                ui.setup.classList.remove('hidden');
            }
        });

        function setupYouTubePlayer() {
            document.getElementById('youtube-player-container').innerHTML = '<div id="yt-player"></div>';
            player = new YT.Player('yt-player', {
                height: '100%',
                width: '100%',
                videoId: videoId,
                playerVars: { 'autoplay': 0, 'controls': 0, 'disablekb': 1, 'fs': 0, 'modestbranding': 1, 'rel': 0 },
                events: { 'onReady': onPlayerReady }
            });
        }

        function onPlayerReady(event) {
            ui.load.classList.add('hidden');
            ui.load.classList.remove('flex');
            ui.karaoke.classList.remove('hidden');
            
            syncOffset = 0;
            score = 0;
            combo = 1;
            updateHUD();
            updateSyncDisplay();
            
            currentLineIndex = -1;
            currentLineMaxPoints = 0;
            
            ui.curLyric.innerHTML = "<span class='lyric-word'>¡Prepara</span> <span class='lyric-word'>tu</span> <span class='lyric-word'>voz!</span>";
            ui.nxtLyric.innerText = "Presiona Iniciar Canción";
        }

        function updateHUD() {
            ui.scoreDisp.innerText = score;
            ui.comboDisp.innerText = `x${combo}`;
            if (combo === 1 && score > 0) {
                ui.comboDisp.classList.remove('text-yellow-400');
                ui.comboDisp.classList.add('text-red-500');
                setTimeout(() => {
                    ui.comboDisp.classList.remove('text-red-500');
                    ui.comboDisp.classList.add('text-yellow-400');
                }, 500);
            }
        }

        function showFloatingScore(points) {
            const floatEl = document.createElement('div');
            floatEl.className = 'floating-score';
            floatEl.innerText = `+${points}`;
            const offset = (Math.random() - 0.5) * 150;
            floatEl.style.left = `calc(50% + ${offset}px)`;
            ui.floatingContainer.appendChild(floatEl);
            setTimeout(() => floatEl.remove(), 1000);
        }

        document.getElementById('btn-start-karaoke').addEventListener('click', () => {
            ui.overlay.classList.add('hidden');
            ui.hud.classList.remove('hidden'); 
            ui.micMonitor.classList.remove('hidden');
            player.playVideo();
            initMicForScoring(); 
            
            lastYTTime = player.getCurrentTime();
            lastPerformanceTime = performance.now();
            syncLoop(); 
        });

        // --- STREAMING_CHUNK:Word Rendering and Rendering Loop... ---
        function renderCurrentLineWordByWord(text) {
            ui.curLyric.innerHTML = '';
            ui.curLyric.classList.remove('success');
            const words = text.split(/\s+/);
            
            words.forEach((word, index) => {
                if (word.trim() === '') return;
                const span = document.createElement('span');
                span.className = 'lyric-word';
                span.innerText = word;
                ui.curLyric.appendChild(span);
                
                // FIX: Agregamos un nodo de texto con un espacio físico. 
                // Esto evita el colapso visual y el amontonamiento de CSS.
                if (index < words.length - 1) {
                    ui.curLyric.appendChild(document.createTextNode(' '));
                }
            });
        }

        function syncLoop() {
            if (player && player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING) {
                const currentYTTime = player.getCurrentTime();
                const now = performance.now();

                // Interpolación
                if (currentYTTime !== lastYTTime) {
                    lastYTTime = currentYTTime;
                    lastPerformanceTime = now;
                }
                const interpolatedTime = lastYTTime + ((now - lastPerformanceTime) / 1000);
                const finalTime = interpolatedTime + syncOffset;
                
                let newIndex = -1;
                for (let i = 0; i < lrcData.length; i++) {
                    if (finalTime >= lrcData[i].time) {
                        newIndex = i;
                    } else { break; }
                }

                if (newIndex !== currentLineIndex && newIndex >= 0) {
                    // Evaluar la línea anterior para romper o mantener el combo
                    if (currentLineIndex >= 0 && currentLineMaxPoints === 0 && lrcData[currentLineIndex].text.length > 2) {
                        combo = 1; // Si max points es 0, no cantó la frase (pierde combo)
                        updateHUD();
                    } else if (currentLineMaxPoints > 0) {
                        combo++; // Aumenta combo para la siguiente frase
                        updateHUD();
                    }

                    currentLineIndex = newIndex;
                    currentLineMaxPoints = 0; // Reiniciar puntos para la nueva línea
                    
                    renderCurrentLineWordByWord(lrcData[currentLineIndex].text);
                    ui.nxtLyric.innerText = lrcData[currentLineIndex + 1] ? lrcData[currentLineIndex + 1].text : "";
                }

                // EFECTO DE LLENADO (Karaoke Fill) Palabra por Palabra por Interpolación de Tiempo
                if (currentLineIndex >= 0) {
                    const lineStart = lrcData[currentLineIndex].time;
                    const lineEnd = lrcData[currentLineIndex + 1] ? lrcData[currentLineIndex + 1].time : lineStart + 4;
                    
                    let progress = 0;
                    if (finalTime > lineStart && finalTime < lineEnd) {
                        progress = (finalTime - lineStart) / (lineEnd - lineStart);
                    } else if (finalTime >= lineEnd) {
                        progress = 1;
                    }
                    progress = Math.max(0, Math.min(progress, 1));
                    
                    const wordSpans = ui.curLyric.querySelectorAll('.lyric-word');
                    const totalWords = wordSpans.length;
                    
                    const wordsToFill = Math.floor(progress * (totalWords + 1)); 

                    wordSpans.forEach((span, idx) => {
                        if (idx < wordsToFill) {
                            span.classList.add('filled');
                        } else {
                            span.classList.remove('filled');
                        }
                    });
                }
            }
            animationFrameId = requestAnimationFrame(syncLoop);
        }

        // --- STREAMING_CHUNK:Interaction Logic and Voice Scoring... ---
        function updateSyncDisplay() {
            const sign = syncOffset > 0 ? "+" : "";
            ui.syncDisp.innerText = `${sign}${syncOffset.toFixed(1)}s`;
        }

        document.getElementById('btn-sync-m5').addEventListener('click', () => { syncOffset -= 5; updateSyncDisplay(); });
        document.getElementById('btn-sync-m').addEventListener('click', () => { syncOffset -= 0.5; updateSyncDisplay(); });
        document.getElementById('btn-sync-p').addEventListener('click', () => { syncOffset += 0.5; updateSyncDisplay(); });
        document.getElementById('btn-sync-p5').addEventListener('click', () => { syncOffset += 5; updateSyncDisplay(); });

        document.getElementById('btn-exit').addEventListener('click', () => {
            cancelAnimationFrame(animationFrameId);
            if(player && player.destroy) player.destroy();
            ui.karaoke.classList.add('hidden');
            ui.hud.classList.add('hidden');
            ui.micMonitor.classList.add('hidden');
            ui.setup.classList.remove('hidden');
            ui.overlay.classList.remove('hidden');
            hideError();
            if(recognition) recognition.stop();
        });

        let idleTimer;
        document.addEventListener('mousemove', () => {
            if (!ui.karaoke.classList.contains('hidden')) {
                ui.controls.classList.remove('idle-hide');
                ui.controls.classList.add('idle-show');
                clearTimeout(idleTimer);
                idleTimer = setTimeout(() => {
                    ui.controls.classList.remove('idle-show');
                    ui.controls.classList.add('idle-hide');
                }, 3500);
            }
        });

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        function initMicForScoring() {
            if (!SpeechRecognition) {
                ui.micText.innerText = "Micrófono no soportado en este navegador.";
                ui.micText.classList.add("text-red-400");
                return;
            }
            
            try {
                recognition = new SpeechRecognition();
                recognition.lang = 'es-ES';
                recognition.continuous = true;
                recognition.interimResults = true; 

                const getCleanWordsArray = (str) => {
                    const cleanStr = str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^\w\s]/gi, '').toLowerCase();
                    return cleanStr.split(/\s+/).filter(w => w.length > 0);
                };

                recognition.onresult = (event) => {
                    let transcript = "";
                    for (let i = Math.max(0, event.results.length - 3); i < event.results.length; ++i) {
                        transcript += event.results[i][0].transcript;
                    }
                    
                    ui.micText.innerText = `"${transcript.trim()}"`;
                    ui.micMonitor.classList.remove('opacity-0');
                    
                    clearTimeout(micMonitorTimeout);
                    micMonitorTimeout = setTimeout(() => {
                        ui.micText.innerText = "...";
                    }, 2500);

                    if (currentLineIndex < 0 || !lrcData[currentLineIndex]) return;
                    
                    const saidWords = getCleanWordsArray(transcript);
                    const targetWords = getCleanWordsArray(lrcData[currentLineIndex].text);

                    if (targetWords.length === 0) return;

                    let matchCount = 0;
                    targetWords.forEach(targetWord => {
                        if (saidWords.includes(targetWord)) {
                            matchCount++;
                        }
                    });

                    const hitRatio = matchCount / targetWords.length;
                    
                    // REGLA: Si pasa del 50%, se activa la puntuación incremental
                    if (hitRatio >= 0.5) {
                        ui.curLyric.classList.add('success'); // Brillo dorado (visual success)
                        
                        // Calculo Proporcional: 50% = 100 puntos, 100% = 300 puntos. Interpolación lineal.
                        // (hitRatio - 0.5) / 0.5 nos da un valor entre 0 y 1.
                        const basePoints = 100 + ((hitRatio - 0.5) / 0.5) * 200;
                        const totalPossiblePointsForLine = Math.round(basePoints) * combo;
                        
                        // Sumar solo la diferencia (incremental)
                        const incrementalPoints = totalPossiblePointsForLine - currentLineMaxPoints;
                        
                        if (incrementalPoints > 0) {
                            score += incrementalPoints;
                            currentLineMaxPoints = totalPossiblePointsForLine; // Actualiza el máximo logrado en esta línea
                            showFloatingScore(incrementalPoints);
                            updateHUD();
                        }
                    }
                };

                recognition.onerror = (e) => {
                    if (e.error !== 'no-speech') {
                        ui.micText.innerText = "Error Mic: " + e.error;
                        ui.micText.classList.add("text-red-400");
                    }
                };
                
                recognition.onend = () => { 
                    if (!ui.karaoke.classList.contains('hidden')) {
                        try { recognition.start(); } catch(e){} 
                    }
                };
                
                recognition.start(); 
            } catch(e) {
                ui.micText.innerText = "Permisos de micrófono denegados.";
            }
        }
    </script>
</body>
</html>
