<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke Autónomo IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap');
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0f172a;
            color: white;
            overflow: hidden; /* Evitar scroll en la pantalla TV */
        }

        /* Estilos del Karaoke */
        .lyric-line {
            transition: all 0.3s ease;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
        }
        
        .lyric-active {
            color: #fbbf24; /* Amarillo dorado por defecto */
            font-size: 3.5rem;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.6), 2px 2px 10px rgba(0,0,0,1);
            transform: scale(1.05);
        }

        .lyric-next {
            color: rgba(255, 255, 255, 0.5);
            font-size: 2rem;
            margin-top: 1rem;
        }

        /* Brillo de acierto si cantas bien (Micrófono pasivo) */
        .lyric-success {
            color: #22c55e !important;
            text-shadow: 0 0 30px rgba(34, 197, 94, 0.9), 0 0 10px rgba(0,0,0,1) !important;
        }

        #youtube-player-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            pointer-events: none;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.65);
            z-index: -1;
        }

        /* Ocultar UI si no hay movimiento */
        .idle-hide {
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        .idle-show {
            opacity: 1;
            transition: opacity 0.5s ease;
        }
        
        /* Animación de carga */
        .loader {
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center">

    <!-- PANTALLA DE CONFIGURACIÓN -->
    <div id="setup-screen" class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-lg z-10">
        <h1 class="text-3xl font-black mb-6 text-center text-blue-400"><i class="fas fa-microphone-alt"></i> Karaoke Pro IA</h1>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm text-gray-400 mb-1">API Key Gemini</label>
                <!-- API KEY PRECARGADA -->
                <input type="password" id="api-key" value="AQ.Ab8RN6IDQ5yf-e0uvjLYsvhgx8pAqU_CfB0yLmOJMcFnJz4wKg" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500" placeholder="Tu API Key de Google Studio">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1">Link del Video de YouTube</label>
                <input type="text" id="youtube-url" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500" placeholder="Ej: https://www.youtube.com/watch?v=...">
            </div>
            
            <button id="btn-fetch" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg transition-colors mt-4">
                Preparar Karaoke
            </button>
        </div>
    </div>

    <!-- PANTALLA DE CARGA -->
    <div id="loading-screen" class="hidden flex-col items-center justify-center z-10">
        <div class="loader mb-4"></div>
        <p id="loading-text" class="text-xl font-bold text-blue-300">Conectando...</p>
    </div>

    <!-- PANTALLA DE KARAOKE -->
    <div id="karaoke-screen" class="hidden w-full h-full relative flex flex-col justify-center items-center">
        <!-- Contenedor del video de YouTube de fondo -->
        <div id="youtube-player-container"></div>
        <div class="overlay"></div>

        <!-- Botón gigante para iniciar (necesario por politicas del navegador) -->
        <div id="start-overlay" class="absolute inset-0 flex items-center justify-center bg-black/80 z-20">
            <button id="btn-start-karaoke" class="bg-green-500 hover:bg-green-400 text-white font-black text-3xl py-6 px-10 rounded-full shadow-[0_0_30px_rgba(34,197,94,0.6)] transform hover:scale-105 transition-all">
                <i class="fas fa-play mr-2"></i> ¡Comenzar Karaoke!
            </button>
        </div>

        <!-- Letras -->
        <div id="lyrics-container" class="text-center w-4/5 z-10 mt-10">
            <div id="current-lyric" class="lyric-line lyric-active">...</div>
            <div id="next-lyric" class="lyric-line lyric-next">...</div>
        </div>

        <!-- Panel de Control Inferior (Se oculta solo) -->
        <div id="controls-panel" class="absolute bottom-8 left-1/2 transform -translate-x-1/2 bg-black/50 backdrop-blur-md rounded-xl p-4 flex gap-4 idle-show z-10 border border-white/10">
            <button id="btn-sync-m5" class="px-3 py-2 bg-slate-700 hover:bg-slate-600 rounded text-sm font-bold">-5s</button>
            <button id="btn-sync-m" class="px-3 py-2 bg-slate-700 hover:bg-slate-600 rounded text-sm font-bold">-0.5s</button>
            <div class="flex flex-col items-center justify-center px-4">
                <span class="text-xs text-gray-400 uppercase">Sincronización</span>
                <span id="sync-display" class="font-mono font-bold text-blue-400">0.0s</span>
            </div>
            <button id="btn-sync-p" class="px-3 py-2 bg-slate-700 hover:bg-slate-600 rounded text-sm font-bold">+0.5s</button>
            <button id="btn-sync-p5" class="px-3 py-2 bg-slate-700 hover:bg-slate-600 rounded text-sm font-bold">+5s</button>
            <button id="btn-exit" class="ml-4 px-4 py-2 bg-red-600 hover:bg-red-500 rounded text-sm font-bold"><i class="fas fa-times"></i> Salir</button>
        </div>
    </div>

    <!-- API de YouTube -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // --- VARIABLES DE ESTADO ---
        let lrcData = [];
        let currentLineIndex = -1;
        let player;
        let videoId = "";
        let syncOffset = 0; // Segundos a sumar/restar al tiempo del video
        let animationFrameId;
        
        // Elementos UI
        const setupScreen = document.getElementById('setup-screen');
        const loadingScreen = document.getElementById('loading-screen');
        const karaokeScreen = document.getElementById('karaoke-screen');
        const startOverlay = document.getElementById('start-overlay');
        const loadingText = document.getElementById('loading-text');
        const currentLyricEl = document.getElementById('current-lyric');
        const nextLyricEl = document.getElementById('next-lyric');
        const syncDisplay = document.getElementById('sync-display');
        const controlsPanel = document.getElementById('controls-panel');

        // --- 1. LÓGICA DE EXTRACCIÓN Y GEMINI ---
        
        function extractVideoId(url) {
            const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
            const match = url.match(regex);
            return match ? match[1] : null;
        }

        async function fetchVideoTitle(vidId) {
            try {
                const response = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${vidId}`);
                const data = await response.json();
                return data.title || "Canción Desconocida";
            } catch (e) {
                return "Canción Desconocida";
            }
        }

        async function fetchLyricsFromGemini(title, apiKey) {
            const prompt = `Actúa como una base de datos experta en letras de canciones. Tu objetivo es proporcionar la letra EXACTA y ORIGINAL de la canción que corresponde al título de YouTube: "${title}". 
            REGLAS ESTRICTAS:
            1. Proporciona la letra en formato LRC puro (ejemplo: [00:15.22] Línea de la canción).
            2. NO inventes, no traduzcas y no resumas la letra. Usa la letra real. Si no la sabes exactamente, intenta buscar la versión oficial más conocida.
            3. Estima los tiempos LRC lo más precisos posibles basándote en la versión de estudio original.
            4. NO incluyas introducciones, comentarios, avisos ni formato markdown (\`\`\`). SOLO devuelve el texto LRC puro.`;

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
            
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                })
            });

            // AQUÍ EVALUAMOS EL ERROR REAL
            if (!response.ok) {
                const errorData = await response.json();
                console.error("Detalle de Google:", errorData);
                throw new Error(`Error de Google AI: ${errorData.error.message}`);
            }
            
            const data = await response.json();
            
            let rawText = data.candidates[0].content.parts[0].text;
            rawText = rawText.replace(/```lrc/g, '').replace(/```/g, '').trim();
            return rawText;
        }

        function parseLRC(lrcText) {
            const lines = lrcText.split('\n');
            const result = [];
            const regex = /\[(\d{2}):(\d{2}(?:\.\d{1,3})?)\](.*)/;
            
            lines.forEach(line => {
                const match = line.match(regex);
                if (match) {
                    const minutes = parseInt(match[1]);
                    const seconds = parseFloat(match[2]);
                    const text = match[3].trim();
                    const timeInSeconds = (minutes * 60) + seconds;
                    
                    if (text !== "") {
                        result.push({ time: timeInSeconds, text: text });
                    }
                }
            });
            return result.sort((a, b) => a.time - b.time);
        }

        // --- 2. FLUJO PRINCIPAL ---

        document.getElementById('btn-fetch').addEventListener('click', async () => {
            const apiKey = document.getElementById('api-key').value.trim();
            const url = document.getElementById('youtube-url').value.trim();

            if (!apiKey || !url) return alert("Llena todos los campos.");
            
            videoId = extractVideoId(url);
            if (!videoId) return alert("Enlace de YouTube no válido.");

            setupScreen.classList.add('hidden');
            loadingScreen.classList.remove('hidden');
            loadingScreen.classList.add('flex');

            try {
                loadingText.innerText = "Obteniendo título del video...";
                const videoTitle = await fetchVideoTitle(videoId);
                
                loadingText.innerText = `Buscando letra de: ${videoTitle}...`;
                const rawLRC = await fetchLyricsFromGemini(videoTitle, apiKey);
                
                lrcData = parseLRC(rawLRC);
                if (lrcData.length === 0) throw new Error("La IA no pudo devolver el formato LRC. Intenta con otra canción.");

                loadingText.innerText = "Preparando escenario...";
                setupYouTubePlayer();

            } catch (error) {
                alert(error.message); // Aquí te mostrará si hay problema de facturación, permisos, etc.
                loadingScreen.classList.add('hidden');
                loadingScreen.classList.remove('flex');
                setupScreen.classList.remove('hidden');
            }
        });

        // --- 3. REPRODUCTOR Y SINCRONIZACIÓN ---

        function setupYouTubePlayer() {
            document.getElementById('youtube-player-container').innerHTML = '<div id="yt-player"></div>';
            
            player = new YT.Player('yt-player', {
                height: '100%',
                width: '100%',
                videoId: videoId,
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'disablekb': 1,
                    'fs': 0,
                    'modestbranding': 1,
                    'rel': 0
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        function onPlayerReady(event) {
            loadingScreen.classList.add('hidden');
            loadingScreen.classList.remove('flex');
            karaokeScreen.classList.remove('hidden');
            
            syncOffset = 0;
            updateSyncDisplay();
            currentLineIndex = -1;
            currentLyricEl.innerText = "¿Listos?";
            nextLyricEl.innerText = "Presiona iniciar...";
        }

        document.getElementById('btn-start-karaoke').addEventListener('click', () => {
            startOverlay.classList.add('hidden');
            player.playVideo();
            initMicForScoring(); 
            syncLoop(); 
        });

        function syncLoop() {
            if (player && player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING) {
                const currentTime = player.getCurrentTime() + syncOffset;
                
                let newIndex = -1;
                for (let i = 0; i < lrcData.length; i++) {
                    if (currentTime >= lrcData[i].time) {
                        newIndex = i;
                    } else {
                        break;
                    }
                }

                if (newIndex !== currentLineIndex && newIndex >= 0) {
                    currentLineIndex = newIndex;
                    currentLyricEl.innerText = lrcData[currentLineIndex].text;
                    currentLyricEl.classList.remove('lyric-success');
                    
                    if (lrcData[currentLineIndex + 1]) {
                        nextLyricEl.innerText = lrcData[currentLineIndex + 1].text;
                    } else {
                        nextLyricEl.innerText = "";
                    }
                }
            }
            animationFrameId = requestAnimationFrame(syncLoop);
        }

        // --- 4. CONTROLES DE CALIBRACIÓN (OFFSET) ---
        
        function updateSyncDisplay() {
            const sign = syncOffset >= 0 ? "+" : "";
            syncDisplay.innerText = `${sign}${syncOffset.toFixed(1)}s`;
        }

        document.getElementById('btn-sync-m5').addEventListener('click', () => { syncOffset -= 5; updateSyncDisplay(); });
        document.getElementById('btn-sync-m').addEventListener('click', () => { syncOffset -= 0.5; updateSyncDisplay(); });
        document.getElementById('btn-sync-p').addEventListener('click', () => { syncOffset += 0.5; updateSyncDisplay(); });
        document.getElementById('btn-sync-p5').addEventListener('click', () => { syncOffset += 5; updateSyncDisplay(); });

        document.getElementById('btn-exit').addEventListener('click', () => {
            cancelAnimationFrame(animationFrameId);
            if(player && player.destroy) player.destroy();
            karaokeScreen.classList.add('hidden');
            setupScreen.classList.remove('hidden');
        });

        // --- 5. OCULTAR UI AUTOMÁTICAMENTE ---
        let idleTimer;
        document.addEventListener('mousemove', () => {
            if (!karaokeScreen.classList.contains('hidden')) {
                controlsPanel.classList.remove('idle-hide');
                controlsPanel.classList.add('idle-show');
                clearTimeout(idleTimer);
                idleTimer = setTimeout(() => {
                    controlsPanel.classList.remove('idle-show');
                    controlsPanel.classList.add('idle-hide');
                }, 3000);
            }
        });

        // --- 6. RECONOCIMIENTO DE VOZ PASIVO (EFECTO VISUAL) ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        function initMicForScoring() {
            if (!SpeechRecognition) return; 
            
            recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.continuous = true;
            recognition.interimResults = true;

            const normalize = (str) => str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^\w\s]/gi, '').toLowerCase().replace(/\s+/g, '');

            recognition.onresult = (event) => {
                if (currentLineIndex < 0) return;
                
                let transcript = "";
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    transcript += event.results[i][0].transcript;
                }

                const said = normalize(transcript);
                const target = normalize(lrcData[currentLineIndex].text);

                if (said.includes(target.substring(0, target.length / 2)) && target.length > 3) {
                    currentLyricEl.classList.add('lyric-success');
                }
            };

            recognition.onend = () => {
                if (!karaokeScreen.classList.contains('hidden')) {
                    try { recognition.start(); } catch(e){}
                }
            };

            try { recognition.start(); } catch(e){}
        }

    </script>
</body>
</html>
